       ================================================================== */

    var TYP_NAME = { berichtsheft: 'Berichtsheft', fachbericht: 'Fachbericht', erklaerung: 'Erklärung' };
    var TYP_PFAD = { berichtsheft: '#/berichtsheft/', fachbericht: '#/fachbericht/', erklaerung: '#/erklaeren/' };
    var WOCHENTAGE_UI = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];

    /* ------------------------------------------------------------ Start */
    function ansichtStart() {
      leere(app);
      var stat = statistik();

      app.appendChild(el('div', { style: 'margin-bottom:16px' }, [
        el('h1', { text: 'Moin!' }),
        el('p.leise', {
          text: KI.da()
            ? 'Sprich, wie du auf der Baustelle sprichst – daraus wird ein Fachtext mit Nennweiten, Werkzeug und Regelwerken.'
            : 'Fachmodus: Die eingebaute Fachsprache-Engine und die Fachdatenbank arbeiten auch ohne KI.',
        }),
      ]));

      app.appendChild(el('div.raster.raster-3', {}, [
        kachel('#/berichtsheft/neu', 'berichtsheft', 'Berichtsheft', 'Ganze Woche einsprechen – die Tage werden erkannt und fachlich formuliert.', ''),
        kachel('#/fachbericht/neu', 'fachbericht', 'Fachbericht', 'Arbeitsschritte, Materialliste, Werkzeugliste, Erklärungen und Zeichnung.', 'kachel-kupfer'),
        kachel('#/erklaeren/neu', 'erklaeren', 'Erklären lassen', '„Erkläre einen Druckminderer“ – mit Rückfragen so tief, wie du willst.', 'kachel-patina'),
      ]));

      app.appendChild(el('a.kachel', { href: '#/nachschlagen', style: 'margin-top:14px;display:block' }, [
        el('div.karte-kopf', {}, [
          el('h3', { text: 'Nachschlagen in der Fachdatenbank', style: 'margin:0' }),
          el('div.rechts', {}, [el('span.chip.chip-blau.mono.klein', { text: stat.gesamt + ' Einträge' })]),
        ]),
        el('p.klein.leise', { style: 'margin:0 0 9px' }, [
          'Sanitär, Heizung, Gas, Lüftung, Klima und Versorgungstechnik: Funktionsprinzipien, Kennwerte, Formeln, Regelwerke und Fehlerbilder.',
        ]),
        el('div.chip-liste', {}, Object.keys(BEREICHE).map(function (b) {
          return el('span.chip.mono.klein', { text: BEREICHE[b] + ' · ' + (stat.nachBereich[b] || 0) });
        })),
      ]));

      var listenKarte = el('section.karte', { style: 'margin-top:18px' }, [
        el('div.karte-kopf', {}, [el('h2', { text: 'Meine Berichte' })]),
        laden('Berichte werden geladen …'),
      ]);
      app.appendChild(listenKarte);

      Speicher.liste().then(function (berichte) {
        leere(listenKarte);
        listenKarte.appendChild(el('div.karte-kopf', {}, [
          el('h2', { text: 'Meine Berichte' }),
          el('div.rechts', {}, [
            el('span.klein.leise.mono', { text: berichte.length + ' gespeichert' }),
          ]),
        ]));
        if (!Speicher.nutztDb()) {
          listenKarte.appendChild(hinweis(
            'Die Berichte liegen nur in diesem Browser. Für die Sicherung über Geräte hinweg die Seite in Claude geöffnet lassen bzw. angemeldet aufrufen.',
            'warnung'
          ));
        }
        if (!berichte.length) {
          listenKarte.appendChild(el('div.leer', {}, [
            el('p', { text: 'Noch keine Berichte. Oben einen Bereich wählen und losreden.' }),
          ]));
          return;
        }
        var liste = el('div');
        berichte.forEach(function (bericht) {
          var zeile = el('div.zeile', {}, [
            el('span.chip.mono.klein', { text: TYP_NAME[bericht.typ] || bericht.typ }),
            el('div', { style: 'flex:1;min-width:0' }, [
              el('a.titel', { href: (TYP_PFAD[bericht.typ] || '#/') + bericht.id, text: bericht.titel || 'Ohne Titel' }),
              el('div.klein.leise.mono', { text: datumText(bericht.geaendert) }),
            ]),
            el('button.knopf.knopf-klein.knopf-still', {
              type: 'button', text: '🗑', title: 'Bericht löschen',
              onclick: function () {
                bestaetigen({ titel: 'Bericht löschen?', text: '„' + (bericht.titel || 'Ohne Titel') + '“ wird endgültig gelöscht.' })
                  .then(function (ja) {
                    if (!ja) return;
                    Speicher.loeschen(bericht.id).then(function () {
                      zeile.remove();
                      meldung('Bericht gelöscht.', 'erfolg');
                    });
                  });
              },
            }),
          ]);
          liste.appendChild(zeile);
        });
        listenKarte.appendChild(liste);
      }).catch(function (f) {
        leere(listenKarte).appendChild(hinweis(f.message || 'Berichte konnten nicht geladen werden.', 'fehler'));
      });
    }

    function kachel(pfad, art, titel, text, klasse) {
      var zeichen = {
        berichtsheft: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
        fachbericht: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7h11a4 4 0 0 1 0 8H7"/><circle cx="19" cy="17" r="2.5"/><path d="M3 17h6"/></svg>',
        erklaeren: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a6 6 0 0 0-3 11v3h6v-3a6 6 0 0 0-3-11Z"/><path d="M10 21h4"/></svg>',
      }[art];
      return el('a.kachel.' + (klasse || ''), { href: pfad }, [
        el('div.kachel-zeichen', { html: zeichen }),
        el('h3', { text: titel }),
        el('p.klein.leise', { text: text, style: 'margin:0' }),
      ]);
    }

    /* ------------------------------------------------------------ Berichtsheft */
    function ansichtBerichtsheft(id) {
      leere(app);
      var zustand = {
        id: id && id !== 'neu' ? id : null,
        titel: 'Berichtsheft KW ' + wochenNummer(new Date()) + ' / ' + new Date().getFullYear(),
        daten: { tage: [], hinweise: [], rohtext: '' },
      };
      var listen = [];
      var fokus = null;

      if (zustand.id) {
        app.appendChild(laden('Bericht wird geladen …'));
        Speicher.lesen(zustand.id).then(function (bericht) {
          if (!bericht) { leere(app).appendChild(hinweis('Bericht nicht gefunden.', 'fehler')); return; }
          zustand.titel = bericht.titel;
          zustand.daten = Object.assign({ tage: [], hinweise: [], rohtext: '' }, bericht.daten);
          zustand.erstellt = bericht.erstellt;
          aufbauen();
        });
      } else {
        aufbauen();
      }

      function alsText() {
        var z = [zustand.titel, ''];
        (zustand.daten.tage || []).forEach(function (tag) {
          z.push(tag.tag);
          (tag.eintraege || []).forEach(function (eintrag) {
            z.push('  ' + eintrag.titel);
            (eintrag.punkte || []).forEach(function (p) {
              z.push('   - ' + p.text);
              if (p.zusatz) z.push('     ' + p.zusatz.replace(/\n/g, '\n     '));
            });
            if ((eintrag.material || []).length) z.push('   Material: ' + eintrag.material.join(', '));
            if ((eintrag.werkzeug || []).length) z.push('   Werkzeug: ' + eintrag.werkzeug.join(', '));
            if ((eintrag.normen || []).length) z.push('   Regelwerke: ' + eintrag.normen.join(', '));
          });
          z.push('');
        });
        return z.join('\n');
      }

      function speichern() {
        return Speicher.speichern({ id: zustand.id, typ: 'berichtsheft', titel: zustand.titel, daten: zustand.daten, erstellt: zustand.erstellt })
          .then(function (neueIdWert) {
            zustand.id = neueIdWert;
            kopf.status.textContent = 'gespeichert · ' + new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            meldung('Gespeichert.', 'erfolg', 2200);
          })
          .catch(function (f) { meldung(f.message || 'Speichern fehlgeschlagen.', 'fehler', 6000); });
      }

      var merkTimer = null;
      function merken() {
        kopf.status.textContent = 'ungespeicherte Änderungen';
        clearTimeout(merkTimer);
        merkTimer = setTimeout(function () {
          Speicher.speichern({ id: zustand.id, typ: 'berichtsheft', titel: zustand.titel, daten: zustand.daten, erstellt: zustand.erstellt })
            .then(function (neueIdWert) {
              zustand.id = neueIdWert;
              kopf.status.textContent = 'gespeichert · ' + new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            })
            .catch(function () { kopf.status.textContent = 'Speichern fehlgeschlagen'; });
        }, 2500);
      }

      var kopf, inhaltsBereich, hinweisBereich;

      function aufbauen() {
        leere(app);
        kopf = berichtKopf({
          titel: zustand.titel,
          gespeichert: Boolean(zustand.id),
          beiTitel: function (wert) { zustand.titel = wert; merken(); },
          beiSpeichern: speichern,
          aktionen: [{ text: 'Text kopieren', aufruf: function () { kopiere(alsText()); } }],
        });

        var diktat = diktatFeld({
          titel: 'Woche einsprechen',
          hilfe: 'Zum Beispiel: „Montag hab ich 100er SML Rohr mit der Flex geschnitten und anmontiert, Dienstag 22er Kupfer verpresst.“',
          platzhalter: 'Diktat der Woche …',
          beiBefehl: befehlAusfuehren,
          aktionen: [
            {
              text: KI.da() ? 'In Fachsprache umwandeln' : 'Fachsprache erzeugen',
              klasse: 'knopf-haupt',
              aufruf: function (text, steuerung) {
                if (!text) { meldung('Bitte zuerst etwas sprechen oder eintippen.', 'warnung'); return; }
                steuerung.stopp();
                return KI.berichtsheft(text).then(function (ergebnis) {
                  uebernehmen(ergebnis);
                  zustand.daten.rohtext = (zustand.daten.rohtext ? zustand.daten.rohtext + '\n' : '') + text;
                  steuerung.leeren();
                  merken();
                  meldung(ergebnis.quelle === 'ki' ? 'Eintrag in Fachsprache erstellt.' : 'Eintrag im Fachmodus erstellt.', 'erfolg');
                });
              },
            },
            {
              text: 'Vorschau Fachbegriffe',
              klasse: 'knopf-still',
              aufruf: function (text) {
                if (!text) return;
                var vorschau = normalisiere(text);
                overlay([
                  el('h3', { text: 'So schreibt die Fachsprache-Engine' }),
                  el('p', { text: vorschau.text, 'data-erklaerbar': '1' }),
                  vorschau.treffer.length ? el('div', {}, [
                    el('h3.label', { text: 'Erkannte Begriffe' }),
                    el('div.chip-liste', {}, vorschau.treffer.map(function (t) {
                      return el('span.chip.chip-blau', { text: t.roh + ' → ' + t.fach });
                    })),
                  ]) : null,
                  el('div.knopf-reihe', { style: 'margin-top:14px;justify-content:flex-end' }, [
                    el('button.knopf.knopf-haupt', { type: 'button', text: 'Alles klar', onclick: overlayZu }),
                  ]),
                ]);
              },
            },
          ],
        });

        inhaltsBereich = el('div');
        hinweisBereich = el('div');

        app.appendChild(kopf.element);
        app.appendChild(el('div', { style: 'margin-top:14px' }, [diktat.element]));
        app.appendChild(el('div', { style: 'margin-top:14px' }, [hinweisBereich]));
        app.appendChild(el('div', { style: 'margin-top:14px' }, [inhaltsBereich]));

        var zeichnung = zeichnungsBereich({
          daten: zustand.daten,
          beiAenderung: merken,
          titel: function () { return zustand.titel; },
        });
        var klapp = el('details.karte', { style: 'margin-top:14px' }, [
          el('summary', { text: 'Zeichnung zum Berichtsheft (optional)', style: 'cursor:pointer;font-weight:600' }),
          el('div', { style: 'margin-top:11px' }, [zeichnung.element]),
        ]);
        app.appendChild(klapp);

        setzeErklaerHandler(function (text) { erklaerDialog(text, {}); });
        zeichneAlles();
      }

      function uebernehmen(ergebnis) {
        (ergebnis.tage || []).forEach(function (tag) {
          var name = normTag(tag.tag);
          var vorhanden = null;
          zustand.daten.tage.forEach(function (t) { if (t.tag === name) vorhanden = t; });
          if (!vorhanden) { vorhanden = { id: neueId(), tag: name, eintraege: [] }; zustand.daten.tage.push(vorhanden); }
          (tag.eintraege || []).forEach(function (eintrag) {
            vorhanden.eintraege.push({
              id: neueId(),
              titel: eintrag.titel || 'Tätigkeit',
              punkte: zuPunkten(eintrag.punkte),
              material: eintrag.material || [],
              werkzeug: eintrag.werkzeug || [],
              normen: eintrag.normen || [],
            });
          });
        });
        zustand.daten.tage.sort(function (a, b) { return tagIndex(a.tag) - tagIndex(b.tag); });
        if ((ergebnis.hinweise || []).length) {
          var alle = (zustand.daten.hinweise || []).concat(ergebnis.hinweise);
          zustand.daten.hinweise = alle.filter(function (h, i) { return alle.indexOf(h) === i; });
        }
        zustand.daten.warnung = ergebnis.warnung || '';
        zeichneAlles();
      }

      function vertiefePunkt(punkt, liste) {
        meldung('Punkt wird ausführlicher erklärt …', 'info', 2000);
        return KI.vertiefung({ begriff: punkt.text, bisher: punkt.zusatz || '' }).then(function (antwort) {
          punkt.zusatz = [antwort.text].concat((antwort.punkte || []).map(function (p) { return '• ' + p; })).filter(Boolean).join('\n');
          punkt.zusatzTitel = antwort.titel || 'Vertiefung';
          merken();
          liste.neuZeichnen();
        });
      }

      function befehlAusfuehren(befehl) {
        switch (befehl.aktion) {
          case 'loeschen': {
            var liste = fokus || listen[listen.length - 1];
            if (!liste) { meldung('Es gibt noch keine Punkte zum Löschen.', 'warnung'); return true; }
            var weg = befehl.nummer ? liste.loescheNummer(befehl.nummer) : liste.loescheText(befehl.suchtext || befehl.text || '');
            meldung(weg ? 'Gelöscht: „' + weg.text.slice(0, 60) + '“' : 'Kein passender Punkt gefunden.', weg ? 'erfolg' : 'warnung');
            return true;
          }
          case 'erklaeren':
            erklaerDialog(befehl.begriff || befehl.text || '', {});
            return true;
          case 'vertiefen': {
            var l = fokus || listen[listen.length - 1];
            var p = l && l.punkteRoh[l.punkteRoh.length - 1];
            if (p) vertiefePunkt(p, l); else meldung('Bitte zuerst einen Punkt anlegen.', 'warnung');
            return true;
          }
          case 'zeichnung':
            return KI.zeichnung(befehl.begriff || befehl.text || zustand.titel, zustand.titel).then(function (ergebnis) {
              zustand.daten.zeichnung = ergebnis;
              merken();
              aufbauen();
              meldung('Zeichnung erstellt.', 'erfolg');
              return true;
            });
          case 'titel':
            if (befehl.text) { zustand.titel = befehl.text; kopf.titelFeld.value = befehl.text; merken(); }
            return true;
          case 'speichern':
            speichern();
            return true;
          default:
            return false;
        }
      }

      function zeichneAlles() {
        leere(inhaltsBereich);
        leere(hinweisBereich);
        listen.length = 0;

        if (zustand.daten.warnung) hinweisBereich.appendChild(hinweis(zustand.daten.warnung, 'warnung'));
        if ((zustand.daten.hinweise || []).length) {
          hinweisBereich.appendChild(el('section.karte', {}, [
            el('div.karte-kopf', {}, [
              el('h3', { text: 'Fachliche Hinweise' }),
              el('div.rechts', {}, [
                el('button.knopf.knopf-klein.knopf-still', {
                  type: 'button', text: 'Ausblenden',
                  onclick: function () { zustand.daten.hinweise = []; merken(); zeichneAlles(); },
                }),
              ]),
            ]),
            el('ul', { style: 'margin:0;padding-left:19px' }, zustand.daten.hinweise.map(function (h) {
              return el('li.klein', { text: h });
            })),
          ]));
        }

        if (!zustand.daten.tage.length) {
          inhaltsBereich.appendChild(el('div.karte.leer', {}, [
            el('p', { text: 'Noch keine Einträge. Oben aufs Mikrofon tippen und die Woche erzählen.' }),
            el('div.knopf-reihe', { style: 'justify-content:center' }, [
              el('button.knopf.knopf-still', { type: 'button', text: '+ Tag von Hand anlegen', onclick: tagAnlegen }),
            ]),
          ]));
          return;
        }

        zustand.daten.tage.forEach(function (tag) { inhaltsBereich.appendChild(tagKarte(tag)); });
        inhaltsBereich.appendChild(el('div.knopf-reihe', { style: 'margin-top:13px' }, [
          el('button.knopf.knopf-still', { type: 'button', text: '+ Tag hinzufügen', onclick: tagAnlegen }),
        ]));
      }

      function tagAnlegen() {
        var frei = WOCHENTAGE_UI.filter(function (t) {
          return !zustand.daten.tage.some(function (x) { return x.tag === t; });
        })[0] || '';
        frageText({ titel: 'Welcher Tag?', text: 'Zum Beispiel Montag oder ein eigener Text.', vorgabe: frei, knopf: 'Tag anlegen' })
          .then(function (name) {
            if (!name) return;
            zustand.daten.tage.push({ id: neueId(), tag: normTag(name), eintraege: [] });
            zustand.daten.tage.sort(function (a, b) { return tagIndex(a.tag) - tagIndex(b.tag); });
            merken();
            zeichneAlles();
          });
      }

      function tagKarte(tag) {
        var karte = el('section.karte');
        karte.appendChild(el('div.karte-kopf', {}, [
          el('h2', { text: tag.tag }),
          el('div.rechts', {}, [
            el('button.knopf.knopf-klein.knopf-still', {
              type: 'button', text: '+ Tätigkeit',
              onclick: function () {
                tag.eintraege.push({ id: neueId(), titel: 'Neue Tätigkeit', punkte: [], material: [], werkzeug: [], normen: [] });
                merken(); zeichneAlles();
              },
            }),
            el('button.knopf.knopf-klein.knopf-gefahr', {
              type: 'button', text: 'Tag löschen',
              onclick: function () {
                bestaetigen({ titel: tag.tag + ' löschen?', text: 'Alle Tätigkeiten dieses Tages werden entfernt.' }).then(function (ja) {
                  if (!ja) return;
                  zustand.daten.tage = zustand.daten.tage.filter(function (t) { return t !== tag; });
                  merken(); zeichneAlles();
                });
              },
            }),
          ]),
        ]));
        if (!tag.eintraege.length) karte.appendChild(el('p.klein.leise', { text: 'Keine Tätigkeit erfasst.' }));
        tag.eintraege.forEach(function (eintrag) { karte.appendChild(eintragBlock(tag, eintrag)); });
        return karte;
      }

      function eintragBlock(tag, eintrag) {
        var liste = punktListe({
          punkte: eintrag.punkte,
          beiAenderung: merken,
          beiVertiefen: function (punkt) { return vertiefePunkt(punkt, liste); },
          beiErklaeren: function (text) { erklaerDialog(text, {}); },
          leerText: 'Noch keine Tätigkeitspunkte.',
        });
        listen.push(liste);

        var block = el('div', { style: 'margin-top:13px' }, [
          el('div.karte-kopf', { style: 'margin-bottom:7px' }, [
            el('input', {
              type: 'text', wert: eintrag.titel, 'aria-label': 'Überschrift der Tätigkeit',
              style: 'font-weight:600;max-width:420px',
              oninput: function (e) { eintrag.titel = e.currentTarget.value; merken(); },
            }),
            el('div.rechts', {}, [
              el('button.knopf.knopf-klein.knopf-still', {
                type: 'button', text: '+ Punkt',
                onclick: function () {
                  eintrag.punkte.push({ id: neueId(), text: 'Neuer Punkt' });
                  merken(); liste.neuZeichnen();
                },
              }),
              el('button.knopf.knopf-klein.knopf-gefahr', {
                type: 'button', text: 'Tätigkeit löschen',
                onclick: function () {
                  tag.eintraege = tag.eintraege.filter(function (x) { return x !== eintrag; });
                  merken(); zeichneAlles();
                },
              }),
            ]),
          ]),
          liste.element,
        ]);
        block.addEventListener('focusin', function () { fokus = liste; });
        block.addEventListener('click', function () { fokus = liste; });

        var zusatz = el('div.raster.raster-3', { style: 'margin-top:11px' });
        [['material', 'Material', 'chip-kupfer'], ['werkzeug', 'Werkzeug', 'chip-blau'], ['normen', 'Regelwerke', 'chip-patina']]
          .forEach(function (feld) {
            eintrag[feld[0]] = eintrag[feld[0]] || [];
            var chips = chipListe({ werte: eintrag[feld[0]], klasse: feld[2], beiAenderung: merken, hinzu: feld[1] });
            zusatz.appendChild(el('div', {}, [el('h3.label', { text: feld[1] }), chips.element]));
          });
        block.appendChild(zusatz);
        return block;
      }
    }

    function normTag(name) {
      var t = String(name || '').trim();
      var treffer = WOCHENTAGE_UI.filter(function (w) { return w.toLowerCase() === t.toLowerCase(); })[0];
      return treffer || t || 'Ohne Zuordnung';
    }
    function tagIndex(name) {
      var i = WOCHENTAGE_UI.indexOf(name);
      return i < 0 ? 99 : i;
    }
    function wochenNummer(datum) {
      var d = new Date(Date.UTC(datum.getFullYear(), datum.getMonth(), datum.getDate()));
      var tag = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - tag);
      var start = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil(((d - start) / 86400000 + 1) / 7);
    }

    /* ------------------------------------------------------------ Fachbericht */
    function ansichtFachbericht(id) {
      leere(app);
      var zustand = {
        id: id && id !== 'neu' ? id : null,
        titel: 'Neuer Fachbericht',
        daten: {
          einleitung: '', anlage: '', arbeitsschritte: [], material: [], werkzeug: [],
          arbeitssicherheit: [], normen: [], erklaerungen: [], fazit: '', rohtext: '',
        },
      };
      var listen = [];
      var fokus = null;
      var kopf, inhaltsBereich;

      if (zustand.id) {
        app.appendChild(laden('Bericht wird geladen …'));
        Speicher.lesen(zustand.id).then(function (bericht) {
          if (!bericht) { leere(app).appendChild(hinweis('Bericht nicht gefunden.', 'fehler')); return; }
          zustand.titel = bericht.titel;
          zustand.daten = Object.assign(zustand.daten, bericht.daten);
          zustand.erstellt = bericht.erstellt;
          aufbauen();
        });
      } else {
        aufbauen();
      }

      function alsText() {
        var z = [zustand.titel, ''];
        function abschnitt(name, inhalt) { if (inhalt) { z.push(name.toUpperCase(), inhalt, ''); } }
        abschnitt('Einleitung', zustand.daten.einleitung);
        abschnitt('Objekt und Anlage', zustand.daten.anlage);
        if (zustand.daten.arbeitsschritte.length) {
          z.push('ARBEITSSCHRITTE');
          zustand.daten.arbeitsschritte.forEach(function (s, i) {
            z.push(i + 1 + '. ' + [s.titel, s.text].filter(Boolean).join(' – '));
            if (s.zusatz) z.push('   ' + s.zusatz.replace(/\n/g, '\n   '));
          });
          z.push('');
        }
        if (zustand.daten.material.length) {
          z.push('MATERIALLISTE');
          zustand.daten.material.forEach(function (m) {
            z.push('- ' + [m.bezeichnung, m.dimension, m.menge, m.hinweis].filter(Boolean).join(' | '));
          });
          z.push('');
        }
        if (zustand.daten.werkzeug.length) {
          z.push('WERKZEUGLISTE');
          zustand.daten.werkzeug.forEach(function (w) { z.push('- ' + [w.bezeichnung, w.zweck].filter(Boolean).join(' – ')); });
          z.push('');
        }
        if (zustand.daten.arbeitssicherheit.length) {
          z.push('ARBEITSSICHERHEIT');
          zustand.daten.arbeitssicherheit.forEach(function (s) { z.push('- ' + s.text); });
          z.push('');
        }
        if (zustand.daten.normen.length) {
          z.push('REGELWERKE');
          zustand.daten.normen.forEach(function (n) { z.push('- ' + [n.titel, n.text].filter(Boolean).join(': ')); });
          z.push('');
        }
        if (zustand.daten.erklaerungen.length) {
          z.push('ERKLÄRUNGEN');
          zustand.daten.erklaerungen.forEach(function (e) {
            z.push(e.titel); z.push(e.text); if (e.zusatz) z.push(e.zusatz); z.push('');
          });
        }
        abschnitt('Fazit', zustand.daten.fazit);
        return z.join('\n');
      }

      function speichern() {
        return Speicher.speichern({ id: zustand.id, typ: 'fachbericht', titel: zustand.titel, daten: zustand.daten, erstellt: zustand.erstellt })
          .then(function (neu) {
            zustand.id = neu;
            kopf.status.textContent = 'gespeichert · ' + new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            meldung('Gespeichert.', 'erfolg', 2200);
          })
          .catch(function (f) { meldung(f.message || 'Speichern fehlgeschlagen.', 'fehler', 6000); });
      }

      var merkTimer = null;
      function merken() {
        kopf.status.textContent = 'ungespeicherte Änderungen';
        clearTimeout(merkTimer);
        merkTimer = setTimeout(function () {
          Speicher.speichern({ id: zustand.id, typ: 'fachbericht', titel: zustand.titel, daten: zustand.daten, erstellt: zustand.erstellt })
            .then(function (neu) {
              zustand.id = neu;
              kopf.status.textContent = 'gespeichert · ' + new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            })
            .catch(function () { kopf.status.textContent = 'Speichern fehlgeschlagen'; });
        }, 2500);
      }

      function aufbauen() {
        leere(app);
        kopf = berichtKopf({
          titel: zustand.titel,
          gespeichert: Boolean(zustand.id),
          beiTitel: function (wert) { zustand.titel = wert; merken(); },
          beiSpeichern: speichern,
          aktionen: [{ text: 'Text kopieren', aufruf: function () { kopiere(alsText()); } }],
        });

        var diktat = diktatFeld({
          titel: 'Fachbericht einsprechen',
          hilfe: 'Zum Beispiel: „Montage einer Hauswasserstation im Keller, Absperrung, Filter, Druckminderer und Wasserzähler in 1 Zoll, Anschluss mit 28er Kupfer.“',
          platzhalter: 'Arbeit beschreiben …',
          beiBefehl: befehlAusfuehren,
          aktionen: [
            {
              text: KI.da() ? 'Fachbericht erstellen' : 'Fachbericht erzeugen',
              klasse: 'knopf-haupt',
              aufruf: function (text, steuerung) {
                if (!text) { meldung('Bitte zuerst die Arbeit beschreiben.', 'warnung'); return; }
                steuerung.stopp();
                return KI.fachbericht(text).then(function (ergebnis) {
                  uebernehmen(ergebnis);
                  zustand.daten.rohtext = (zustand.daten.rohtext ? zustand.daten.rohtext + '\n' : '') + text;
                  steuerung.leeren();
                  merken();
                  meldung(ergebnis.quelle === 'ki' ? 'Fachbericht erstellt.' : 'Fachbericht im Fachmodus erstellt.', 'erfolg');
                });
              },
            },
            {
              text: 'Ergänzen',
              klasse: 'knopf-still',
              aufruf: function (text, steuerung) {
                if (!text) return;
                steuerung.stopp();
                return KI.fachbericht('Ergänzung zum bestehenden Bericht: ' + text).then(function (ergebnis) {
                  uebernehmen(ergebnis, true);
                  steuerung.leeren();
                  merken();
                  meldung('Ergänzung übernommen.', 'erfolg');
                });
              },
            },
          ],
        });

        inhaltsBereich = el('div');
        app.appendChild(kopf.element);
        app.appendChild(el('div', { style: 'margin-top:14px' }, [diktat.element]));
        app.appendChild(el('div', { style: 'margin-top:14px' }, [inhaltsBereich]));

        setzeErklaerHandler(function (text) {
          erklaerDialog(text, {
            einfuegen: function (e) {
              zustand.daten.erklaerungen.push({ id: neueId(), titel: e.begriff, text: e.text });
              merken(); zeichneAlles();
            },
          });
        });
        zeichneAlles();
      }

      function uebernehmen(ergebnis, ergaenzen) {
        if (!ergaenzen) {
          if (ergebnis.titel && (zustand.titel === 'Neuer Fachbericht' || !zustand.titel)) {
            zustand.titel = ergebnis.titel;
            kopf.titelFeld.value = zustand.titel;
          }
          zustand.daten.einleitung = ergebnis.einleitung || zustand.daten.einleitung;
          zustand.daten.anlage = ergebnis.anlage || zustand.daten.anlage;
          zustand.daten.fazit = ergebnis.fazit || zustand.daten.fazit;
        }
        (ergebnis.arbeitsschritte || []).forEach(function (s) {
          zustand.daten.arbeitsschritte.push({
            id: neueId(),
            titel: s.titel || '',
            text: [s.beschreibung, s.hinweis ? 'Hinweis: ' + s.hinweis : ''].filter(Boolean).join(' '),
          });
        });
        (ergebnis.material || []).forEach(function (m) {
          zustand.daten.material.push({
            id: neueId(), bezeichnung: m.bezeichnung || '', dimension: m.dimension || '', menge: m.menge || '', hinweis: m.hinweis || '',
          });
        });
        (ergebnis.werkzeug || []).forEach(function (w) {
          zustand.daten.werkzeug.push({ id: neueId(), bezeichnung: w.bezeichnung || '', zweck: w.zweck || '' });
        });
        zustand.daten.arbeitssicherheit = zustand.daten.arbeitssicherheit.concat(zuPunkten(ergebnis.arbeitssicherheit || []));
        (ergebnis.normen || []).forEach(function (n) {
          zustand.daten.normen.push({ id: neueId(), titel: n.bezeichnung || '', text: n.inhalt || '' });
        });
        (ergebnis.erklaerungen || []).forEach(function (e) {
          zustand.daten.erklaerungen.push({ id: neueId(), titel: e.begriff || '', text: e.text || '' });
        });
        zustand.daten.warnung = ergebnis.warnung || '';
        entdoppeln();
        zeichneAlles();
      }

      function entdoppeln() {
        function einmalig(liste, schluesselFn) {
          var gesehen = {};
          return liste.filter(function (eintrag) {
            var k = String(schluesselFn(eintrag) || '').toLowerCase().trim();
            if (!k || gesehen[k]) return false;
            gesehen[k] = true;
            return true;
          });
        }
        zustand.daten.material = einmalig(zustand.daten.material, function (m) { return m.bezeichnung + '|' + m.dimension; });
        zustand.daten.werkzeug = einmalig(zustand.daten.werkzeug, function (w) { return w.bezeichnung; });
        zustand.daten.normen = einmalig(zustand.daten.normen, function (n) { return n.titel; });
        zustand.daten.erklaerungen = einmalig(zustand.daten.erklaerungen, function (e) { return e.titel; });
        zustand.daten.arbeitssicherheit = einmalig(zustand.daten.arbeitssicherheit, function (s) { return s.text; });
      }

      function vertiefePunkt(punkt, liste) {
        meldung('Wird ausführlicher erklärt …', 'info', 2000);
        return KI.vertiefung({ begriff: [punkt.titel, punkt.text].filter(Boolean).join(': '), bisher: punkt.zusatz || '' })
          .then(function (antwort) {
            punkt.zusatz = [antwort.text].concat((antwort.punkte || []).map(function (p) { return '• ' + p; })).filter(Boolean).join('\n');
            punkt.zusatzTitel = antwort.titel || 'Vertiefung';
            merken(); liste.neuZeichnen();
          });
      }

      function befehlAusfuehren(befehl) {
        switch (befehl.aktion) {
          case 'loeschen': {
            var liste = fokus || listen[0];
            if (!liste) { meldung('Es gibt noch keine Punkte zum Löschen.', 'warnung'); return true; }
            var weg = befehl.nummer ? liste.loescheNummer(befehl.nummer) : liste.loescheText(befehl.suchtext || befehl.text || '');
            meldung(weg ? 'Gelöscht.' : 'Kein passender Punkt gefunden.', weg ? 'erfolg' : 'warnung');
            return true;
          }
          case 'erklaeren':
            erklaerDialog(befehl.begriff || befehl.text || '', {
              einfuegen: function (e) {
                zustand.daten.erklaerungen.push({ id: neueId(), titel: e.begriff, text: e.text });
                merken(); zeichneAlles();
              },
            });
            return true;
          case 'zeichnung':
            return KI.zeichnung(befehl.begriff || befehl.text || zustand.titel, zustand.titel).then(function (ergebnis) {
              zustand.daten.zeichnung = ergebnis;
              merken(); zeichneAlles();
              meldung('Zeichnung erstellt.', 'erfolg');
              return true;
            });
          case 'titel':
            if (befehl.text) { zustand.titel = befehl.text; kopf.titelFeld.value = befehl.text; merken(); }
            return true;
          case 'speichern':
            speichern();
            return true;
          default:
            return false;
        }
      }

      function textAbschnitt(beschriftung, feld, platzhalter) {
        return el('section.karte', {}, [
          el('div.karte-kopf', {}, [el('h2', { text: beschriftung })]),
          el('textarea', {
            rows: 4, placeholder: platzhalter, wert: zustand.daten[feld] || '', 'data-erklaerbar': '1',
            oninput: function (e) { zustand.daten[feld] = e.currentTarget.value; merken(); },
          }),
          el('div.knopf-reihe', { style: 'margin-top:9px' }, [
            el('button.knopf.knopf-klein.knopf-still', {
              type: 'button', text: 'Ausführlicher formulieren',
              onclick: function (ereignis) {
                var knopf = ereignis.currentTarget;
                var feldKnoten = knopf.closest('section').querySelector('textarea');
                if (!feldKnoten.value.trim()) { meldung('Bitte zuerst etwas eintragen.', 'warnung'); return; }
                knopf.disabled = true;
                KI.vertiefung({
                  begriff: beschriftung + ' des Fachberichts',
                  frage: 'Formuliere ausführlicher und fachlich genauer: ' + feldKnoten.value,
                  bisher: feldKnoten.value,
                }).then(function (antwort) {
                  feldKnoten.value = antwort.text;
                  zustand.daten[feld] = antwort.text;
                  merken();
                }).catch(function (f) { meldung(f.message || 'Hat nicht geklappt.', 'fehler'); })
                  .then(function () { knopf.disabled = false; });
              },
            }),
          ]),
        ]);
      }

      function tabellenBereich(o) {
        var bereich = el('section.karte');
        function zeichne() {
          leere(bereich);
          bereich.appendChild(el('div.karte-kopf', {}, [
            el('h2', { text: o.beschriftung }),
            el('div.rechts', {}, [
              el('button.knopf.knopf-klein.knopf-still', {
                type: 'button', text: '+ Zeile',
                onclick: function () { o.liste.push(Object.assign({ id: neueId() }, o.leerzeile)); merken(); zeichne(); },
              }),
            ]),
          ]));
          if (!o.liste.length) { bereich.appendChild(el('p.klein.leise', { text: 'Noch nichts erfasst.' })); return; }
          var kopfzeile = el('tr', {}, o.spalten.map(function (s) { return el('th', { text: s.titel }); })
            .concat([el('th', { 'aria-label': 'Aktion' })]));
          var zeilen = o.liste.map(function (eintrag) {
            return el('tr', {}, o.spalten.map(function (s) {
              return el('td', {
                contenteditable: 'true', 'data-erklaerbar': '1', text: eintrag[s.feld] || '',
                onblur: function (e) {
                  var neu = e.currentTarget.textContent.trim();
                  if (neu !== eintrag[s.feld]) { eintrag[s.feld] = neu; merken(); }
                },
              });
            }).concat([
              el('td', { style: 'white-space:nowrap' }, [
                el('button.knopf.knopf-klein.knopf-still', {
                  type: 'button', text: 'Erklären',
                  onclick: function () { erklaerDialog(eintrag[o.spalten[0].feld], {}); },
                }),
                el('button.knopf.knopf-klein.knopf-still', {
                  type: 'button', text: '🗑',
                  onclick: function () {
                    var i = o.liste.indexOf(eintrag);
                    if (i >= 0) o.liste.splice(i, 1);
                    merken(); zeichne();
                  },
                }),
              ]),
            ]));
          });
          bereich.appendChild(el('div.tabelle-rahmen', {}, [
            el('table.tabelle', {}, [el('thead', {}, [kopfzeile]), el('tbody', {}, zeilen)]),
          ]));
        }
        zeichne();
        return bereich;
      }

      function punktBereich(o) {
        var bereich = el('section.karte');
        zustand.daten[o.feld] = zustand.daten[o.feld] || [];
        var liste = punktListe({
          punkte: zustand.daten[o.feld],
          beiAenderung: merken,
          beiVertiefen: o.mitVertiefung === false ? null : function (punkt) { return vertiefePunkt(punkt, liste); },
          beiErklaeren: function (text) { erklaerDialog(text, {}); },
          leerText: o.leerText,
        });
        listen.push(liste);
        bereich.appendChild(el('div.karte-kopf', {}, [
          el('h2', { text: o.beschriftung }),
          el('div.rechts', {}, [
            el('button.knopf.knopf-klein.knopf-still', {
              type: 'button', text: '+ Punkt',
              onclick: function () {
                frageText({ titel: o.beschriftung + ': neuer Punkt', knopf: 'Hinzufügen', mehrzeilig: true }).then(function (text) {
                  if (!text) return;
                  zustand.daten[o.feld].push({ id: neueId(), text: text });
                  merken(); liste.neuZeichnen();
                });
              },
            }),
          ]),
        ]));
        bereich.appendChild(liste.element);
        bereich.addEventListener('focusin', function () { fokus = liste; });
        bereich.addEventListener('click', function () { fokus = liste; });
        return bereich;
      }

      function erklaerungsBereich() {
        var bereich = el('section.karte');
        zustand.daten.erklaerungen = zustand.daten.erklaerungen || [];
        var liste = punktListe({
          punkte: zustand.daten.erklaerungen,
          beiAenderung: merken,
          beiVertiefen: function (punkt) { return vertiefePunkt(punkt, liste); },
          beiErklaeren: function (text) { erklaerDialog(text, {}); },
          leerText: 'Noch keine Erklärungen. Begriff einsprechen: „Erkläre einen Druckminderer“.',
        });
        listen.push(liste);
        var feld = diktatFeld({
          titel: 'Begriff erklären lassen',
          hilfe: 'Die Erklärung lässt sich direkt in den Fachbericht übernehmen.',
          platzhalter: 'z. B. Druckminderer, Systemtrenner, hydraulischer Abgleich …',
          aktionen: [{
            text: 'Erklären',
            klasse: 'knopf-haupt',
            aufruf: function (text, steuerung) {
              if (!text) { meldung('Bitte einen Begriff nennen.', 'warnung'); return; }
              steuerung.stopp(); steuerung.leeren();
              erklaerDialog(text, {
                einfuegen: function (e) {
                  zustand.daten.erklaerungen.push({ id: neueId(), titel: e.begriff, text: e.text });
                  merken(); liste.neuZeichnen();
                },
              });
            },
          }],
        });
        bereich.appendChild(el('div.karte-kopf', {}, [el('h2', { text: 'Erklärungen und Funktionsprinzipien' })]));
        bereich.appendChild(liste.element);
        bereich.appendChild(el('div', { style: 'margin-top:13px' }, [feld.element]));
        return bereich;
      }

      function zeichneAlles() {
        leere(inhaltsBereich);
        listen.length = 0;
        if (zustand.daten.warnung) inhaltsBereich.appendChild(hinweis(zustand.daten.warnung, 'warnung'));

        inhaltsBereich.appendChild(textAbschnitt('Einleitung / Ausgangslage', 'einleitung', 'Warum wurde die Arbeit ausgeführt, was war der Zustand vorher?'));
        inhaltsBereich.appendChild(textAbschnitt('Objekt und Anlage', 'anlage', 'Gebäude, Anlagenteil, Besonderheiten …'));
        inhaltsBereich.appendChild(punktBereich({ beschriftung: 'Arbeitsschritte', feld: 'arbeitsschritte', leerText: 'Noch keine Arbeitsschritte – oben einsprechen.' }));
        inhaltsBereich.appendChild(tabellenBereich({
          beschriftung: 'Materialliste',
          liste: zustand.daten.material,
          spalten: [
            { titel: 'Bezeichnung', feld: 'bezeichnung' },
            { titel: 'Dimension', feld: 'dimension' },
            { titel: 'Menge', feld: 'menge' },
            { titel: 'Hinweis', feld: 'hinweis' },
          ],
          leerzeile: { bezeichnung: '', dimension: '', menge: '', hinweis: '' },
        }));
        inhaltsBereich.appendChild(tabellenBereich({
          beschriftung: 'Werkzeugliste',
          liste: zustand.daten.werkzeug,
          spalten: [{ titel: 'Werkzeug', feld: 'bezeichnung' }, { titel: 'Zweck', feld: 'zweck' }],
          leerzeile: { bezeichnung: '', zweck: '' },
        }));
        inhaltsBereich.appendChild(punktBereich({ beschriftung: 'Arbeitssicherheit', feld: 'arbeitssicherheit', leerText: 'Noch keine Sicherheitshinweise.', mitVertiefung: false }));
        inhaltsBereich.appendChild(punktBereich({ beschriftung: 'Regelwerke und Normen', feld: 'normen', leerText: 'Noch keine Regelwerke erfasst.' }));
        inhaltsBereich.appendChild(erklaerungsBereich());
        inhaltsBereich.appendChild(zeichnungsBereich({
          daten: zustand.daten, beiAenderung: merken, titel: function () { return zustand.titel; },
        }).element);
        inhaltsBereich.appendChild(textAbschnitt('Fazit', 'fazit', 'Ergebnis, Prüfung, Übergabe, was gelernt wurde …'));
      }
    }

    /* ------------------------------------------------------------ Erklären */
    var VORSCHLAEGE = ['Druckminderer', 'Sicherheitsventil', 'Membran-Ausdehnungsgefäß', 'Systemtrenner BA',
      'Hydraulischer Abgleich', 'Legionellen', 'Pressfitting', 'Geruchsverschluss', 'Abwasserhebeanlage', 'Gas-Brennwertgerät'];

    function ansichtErklaeren(id) {
      leere(app);
      var zustand = {
        id: id && id !== 'neu' ? id : null,
        titel: 'Neue Erklärung',
        daten: { begriff: '', kurz: '', abschnitte: [], normen: [], stichworte: [], verlauf: [], tiefe: 1 },
      };
      var kopf, inhaltsBereich;

      if (zustand.id) {
        app.appendChild(laden('Erklärung wird geladen …'));
        Speicher.lesen(zustand.id).then(function (bericht) {
          if (!bericht) { leere(app).appendChild(hinweis('Erklärung nicht gefunden.', 'fehler')); return; }
          zustand.titel = bericht.titel;
          zustand.daten = Object.assign(zustand.daten, bericht.daten);
          zustand.erstellt = bericht.erstellt;
          aufbauen();
        });
      } else {
        aufbauen();
      }

      function textVon() {
        var d = zustand.daten;
        var teile = [d.begriff, d.kurz];
        (d.abschnitte || []).forEach(function (a) {
          teile.push((a.titel + ': ' + (a.text || '')).trim());
          (a.punkte || []).forEach(function (p) { teile.push('– ' + p); });
        });
        if ((d.normen || []).length) teile.push('Regelwerke: ' + d.normen.join(', '));
        (d.verlauf || []).forEach(function (v) {
          teile.push('Rückfrage: ' + v.frage);
          teile.push((v.titel || 'Vertiefung') + ': ' + v.text);
        });
        return teile.filter(Boolean).join('\n\n');
      }

      function speichern() {
        return Speicher.speichern({ id: zustand.id, typ: 'erklaerung', titel: zustand.titel, daten: zustand.daten, erstellt: zustand.erstellt })
          .then(function (neu) {
            zustand.id = neu;
            kopf.status.textContent = 'gespeichert';
            meldung('Gespeichert.', 'erfolg', 2200);
          })
          .catch(function (f) { meldung(f.message || 'Speichern fehlgeschlagen.', 'fehler'); });
      }

      function merken() { kopf.status.textContent = 'ungespeichert – über „Speichern“ sichern'; }

      function aufbauen() {
        leere(app);
        kopf = berichtKopf({
          titel: zustand.titel,
          gespeichert: Boolean(zustand.id),
          beiTitel: function (wert) { zustand.titel = wert; merken(); },
          beiSpeichern: speichern,
          aktionen: [
            { text: 'Text kopieren', aufruf: function () { kopiere(textVon()); } },
            { text: '🔊 Vorlesen', aufruf: function () { if (!vorlesen(textVon())) meldung('Vorlesen geht hier nicht.', 'warnung'); } },
            { text: 'Stopp', aufruf: vorlesenStopp },
          ],
        });

        var diktat = diktatFeld({
          titel: 'Was soll erklärt werden?',
          hilfe: 'Zum Beispiel: „Erkläre einen Druckminderer“ – danach beliebig nachfragen.',
          platzhalter: 'Begriff oder Frage …',
          beiBefehl: function (befehl) {
            if (befehl.aktion === 'erklaeren') { erklaere(befehl.begriff || befehl.text || ''); return true; }
            if (befehl.aktion === 'vertiefen') {
              if (!zustand.daten.begriff) { meldung('Bitte zuerst einen Begriff erklären lassen.', 'warnung'); return true; }
              if ((zustand.daten.tiefe || 1) < 3 && KI.da()) erklaere(zustand.daten.begriff, (zustand.daten.tiefe || 1) + 1);
              else nachfrage('Bitte noch tiefer und mit Zahlenwerten erläutern.');
              return true;
            }
            if (befehl.aktion === 'speichern') { speichern(); return true; }
            return false;
          },
          aktionen: [
            {
              text: 'Erklären',
              klasse: 'knopf-haupt',
              aufruf: function (text, steuerung) {
                if (!text) { meldung('Bitte einen Begriff nennen.', 'warnung'); return; }
                steuerung.stopp(); steuerung.leeren();
                return erklaere(text);
              },
            },
            {
              text: 'Als Rückfrage stellen',
              klasse: 'knopf-still',
              aufruf: function (text, steuerung) {
                if (!text) return;
                if (!zustand.daten.begriff) { meldung('Bitte zuerst einen Begriff erklären lassen.', 'warnung'); return; }
                steuerung.stopp(); steuerung.leeren();
                return nachfrage(text);
              },
            },
          ],
        });

        inhaltsBereich = el('div');
        app.appendChild(kopf.element);
        app.appendChild(el('div', { style: 'margin-top:14px' }, [diktat.element]));
        app.appendChild(el('div', { style: 'margin-top:14px' }, [inhaltsBereich]));
        setzeErklaerHandler(function (text) { erklaerDialog(text, {}); });
        zeichneAlles();
      }

      function erklaere(begriff, tiefe) {
        leere(inhaltsBereich).appendChild(el('div.karte', {}, [laden('„' + begriff + '“ wird erklärt …')]));
        return KI.erklaerung(begriff, tiefe || 1).then(function (ergebnis) {
          zustand.daten = {
            begriff: ergebnis.begriff,
            kurz: ergebnis.kurz,
            abschnitte: (ergebnis.abschnitte || []).map(function (a) { return Object.assign({ id: neueId() }, a); }),
            normen: ergebnis.normen || [],
            stichworte: ergebnis.stichworte || [],
            verlauf: (tiefe || 1) === 1 ? [] : zustand.daten.verlauf,
            tiefe: ergebnis.tiefe || tiefe || 1,
            quelle: ergebnis.quelle,
            warnung: ergebnis.warnung,
            zeichnung: zustand.daten.zeichnung,
          };
          if (zustand.titel === 'Neue Erklärung' || !zustand.titel) {
            zustand.titel = ergebnis.begriff;
            kopf.titelFeld.value = zustand.titel;
          }
          merken();
          zeichneAlles();
        });
      }

      function nachfrage(frage) {
        var kasten = el('div.karte', {}, [laden('Rückfrage wird beantwortet …')]);
        inhaltsBereich.appendChild(kasten);
        return KI.vertiefung({ begriff: zustand.daten.begriff || zustand.titel, frage: frage, bisher: textVon() })
          .then(function (antwort) {
            antwort.frage = frage;
            antwort.id = neueId();
            zustand.daten.verlauf.push(antwort);
            merken();
            zeichneAlles();
          })
          .catch(function () { kasten.remove(); });
      }

      function zeichneAlles() {
        leere(inhaltsBereich);
        var d = zustand.daten;

        if (!d.begriff) {
          inhaltsBereich.appendChild(el('section.karte', {}, [
            el('div.karte-kopf', {}, [el('h2', { text: 'Häufig gefragt' })]),
            el('p.klein.leise', { text: 'Antippen oder einsprechen.' }),
            el('div.chip-liste', {}, VORSCHLAEGE.map(function (v) {
              return el('button.chip.chip-blau', { type: 'button', text: v, onclick: function () { erklaere(v); } });
            })),
          ]));
          return;
        }

        if (d.warnung) inhaltsBereich.appendChild(hinweis(d.warnung, 'warnung'));

        inhaltsBereich.appendChild(el('section.karte', {}, [
          el('div.karte-kopf', {}, [
            el('h2', { text: d.begriff }),
            el('div.rechts', {}, [
              el('span.chip.mono.klein.' + (d.quelle === 'ki' ? 'chip-patina' : 'chip-kupfer'), {
                text: d.quelle === 'ki' ? 'KI · Stufe ' + (d.tiefe || 1) : 'Fachdatenbank',
              }),
            ]),
          ]),
          el('p', { text: d.kurz, 'data-erklaerbar': '1', style: 'font-size:1.04rem' }),
          el('div.knopf-reihe', {}, [
            (d.tiefe || 1) < 3 && KI.da() ? el('button.knopf.knopf-kupfer', {
              type: 'button', text: (d.tiefe || 1) === 1 ? 'Ausführlicher' : 'Noch ausführlicher',
              onclick: function () { erklaere(d.begriff, (d.tiefe || 1) + 1); },
            }) : null,
            el('button.knopf.knopf-still', { type: 'button', text: 'Neu erklären', onclick: function () { erklaere(d.begriff, 1); } }),
          ]),
        ]));

        (d.abschnitte || []).forEach(function (abschnitt) {
          inhaltsBereich.appendChild(el('section.karte', {}, [
            el('div.karte-kopf', {}, [
              el('h3', { text: abschnitt.titel }),
              el('div.rechts', {}, [
                el('button.knopf.knopf-klein.knopf-still', {
                  type: 'button', text: 'Genauer erläutern',
                  onclick: function () {
                    nachfrage('Erläutere genauer: ' + abschnitt.titel + ' – ' + (abschnitt.text || (abschnitt.punkte || []).join('; ')));
                  },
                }),
                el('button.knopf.knopf-klein.knopf-still', {
                  type: 'button', text: '🗑', title: 'Abschnitt löschen',
                  onclick: function () {
                    d.abschnitte = d.abschnitte.filter(function (a) { return a !== abschnitt; });
                    merken(); zeichneAlles();
                  },
                }),
              ]),
            ]),
            abschnitt.text ? el('p', { text: abschnitt.text, 'data-erklaerbar': '1' }) : null,
            (abschnitt.punkte || []).length
              ? el('ul', { 'data-erklaerbar': '1', style: 'margin:0;padding-left:19px' },
                  abschnitt.punkte.map(function (p) { return el('li', { text: p, style: 'margin-bottom:3px' }); }))
              : null,
          ]));
        });

        if ((d.normen || []).length) {
          inhaltsBereich.appendChild(el('section.karte', {}, [
            el('div.karte-kopf', {}, [el('h3', { text: 'Regelwerke' })]),
            el('div.chip-liste', {}, d.normen.map(function (n) { return el('span.chip.chip-patina', { text: n }); })),
          ]));
        }

        (d.verlauf || []).forEach(function (eintrag) {
          inhaltsBereich.appendChild(el('section.karte', {}, [
            el('div.karte-kopf', {}, [
              el('div', {}, [
                el('div.klein.leise', { text: 'Rückfrage: ' + eintrag.frage }),
                el('h3', { text: eintrag.titel || 'Vertiefung', style: 'margin:0' }),
              ]),
              el('div.rechts', {}, [
                el('button.knopf.knopf-klein.knopf-still', {
                  type: 'button', text: 'Noch genauer',
                  onclick: function () { nachfrage('Noch genauer und mit Zahlenwerten: ' + eintrag.frage); },
                }),
                el('button.knopf.knopf-klein.knopf-still', {
                  type: 'button', text: '🗑',
                  onclick: function () {
                    d.verlauf = d.verlauf.filter(function (v) { return v !== eintrag; });
                    merken(); zeichneAlles();
                  },
                }),
              ]),
            ]),
            el('p', { text: eintrag.text, 'data-erklaerbar': '1' }),
            (eintrag.punkte || []).length
              ? el('ul', { 'data-erklaerbar': '1', style: 'margin:0;padding-left:19px' },
                  eintrag.punkte.map(function (p) { return el('li', { text: p }); }))
              : null,
          ]));
        });

        if ((d.stichworte || []).length) {
          inhaltsBereich.appendChild(el('section.karte', {}, [
            el('div.karte-kopf', {}, [el('h3', { text: 'Passt dazu' })]),
            el('div.chip-liste', {}, d.stichworte.map(function (s) {
              return el('button.chip.chip-blau', { type: 'button', text: s, onclick: function () { erklaerDialog(s, {}); } });
            })),
          ]));
        }

        inhaltsBereich.appendChild(el('details.karte', {}, [
          el('summary', { text: 'Passende Zeichnung erstellen', style: 'cursor:pointer;font-weight:600' }),
          el('div', { style: 'margin-top:11px' }, [
            zeichnungsBereich({
              daten: d, beiAenderung: merken, titel: function () { return d.begriff || zustand.titel; },
            }).element,
          ]),
        ]));
      }
    }

    /* ------------------------------------------------------------ Nachschlagen */
    function ansichtNachschlagen(id) {
      leere(app);
      setzeErklaerHandler(function (text) { erklaerDialog(text, {}); });

      if (id) { zeigeEintrag(id); return; }

      var bereich = '';
      var suchtext = '';
      var stat = statistik();

      app.appendChild(el('div', { style: 'margin-bottom:14px' }, [
        el('h1', { text: 'Nachschlagen' }),
        el('p.leise', {
          text: 'Fachdatenbank zu Sanitär, Heizung, Gas, Lüftung, Klima und Versorgungstechnik – mit Funktionsprinzipien, Kennwerten, Formeln und Regelwerken.',
        }),
      ]));

      var suche = diktatFeld({
        titel: 'Begriff suchen',
        hilfe: 'Zum Beispiel: „Druckminderer“, „hydraulischer Abgleich“, „Rückstauebene“.',
        platzhalter: 'Suchbegriff …',
        beiBefehl: function (befehl) {
          if (befehl.aktion === 'erklaeren') { erklaerDialog(befehl.begriff || befehl.text || '', {}); return true; }
          return false;
        },
        aktionen: [
          { text: 'Suchen', klasse: 'knopf-haupt', aufruf: function (text, steuerung) { suchtext = text; steuerung.stopp(); zeichneErgebnis(); } },
          { text: 'Alles anzeigen', klasse: 'knopf-still', aufruf: function (_t, steuerung) { suchtext = ''; steuerung.leeren(); zeichneErgebnis(); } },
        ],
      });

      var tippTimer = null;
      suche.textfeld.addEventListener('input', function () {
        clearTimeout(tippTimer);
        tippTimer = setTimeout(function () { suchtext = suche.hole(); zeichneErgebnis(); }, 320);
      });

      var bereichsLeiste = el('div.chip-liste', { style: 'margin-bottom:12px' });
      var ergebnisBereich = el('div');
      app.appendChild(suche.element);
      app.appendChild(el('div', { style: 'margin-top:14px' }, [bereichsLeiste, ergebnisBereich]));

      function zeichneBereiche() {
        leere(bereichsLeiste);
        bereichsLeiste.appendChild(el('button.chip' + (bereich === '' ? '.chip-blau' : ''), {
          type: 'button', text: 'Alle (' + stat.gesamt + ')',
          onclick: function () { bereich = ''; zeichneBereiche(); zeichneErgebnis(); },
        }));
        Object.keys(BEREICHE).forEach(function (b) {
          bereichsLeiste.appendChild(el('button.chip' + (bereich === b ? '.chip-blau' : ''), {
            type: 'button', text: BEREICHE[b] + ' (' + (stat.nachBereich[b] || 0) + ')',
            onclick: function () { bereich = b; zeichneBereiche(); zeichneErgebnis(); },
          }));
        });
      }

      function zeichneErgebnis() {
        leere(ergebnisBereich);
        var eintraege;
        if (suchtext) {
          eintraege = sucheWissen(suchtext, { grenze: 25, bereich: bereich || undefined }).map(function (t) { return t.eintrag; });
        } else {
          eintraege = WISSENSBASIS.filter(function (e) { return !bereich || e.bereich === bereich; })
            .slice()
            .sort(function (a, b) { return a.begriff.localeCompare(b.begriff, 'de'); });
        }

        if (!eintraege.length) {
          ergebnisBereich.appendChild(el('div.karte.leer', {}, [
            el('p', { text: 'Kein Eintrag gefunden. Anderen Begriff versuchen – oder direkt erklären lassen.' }),
            el('div.knopf-reihe', { style: 'justify-content:center' }, [
              el('button.knopf.knopf-haupt', {
                type: 'button', text: '„' + suchtext + '“ erklären lassen',
                onclick: function () { erklaerDialog(suchtext, {}); },
              }),
            ]),
          ]));
          return;
        }

        ergebnisBereich.appendChild(el('p.klein.leise.mono', {
          text: suchtext
            ? eintraege.length + ' Treffer für „' + suchtext + '“ · ' + stat.gesamt + ' Einträge insgesamt'
            : eintraege.length + ' von ' + stat.gesamt + ' Einträgen',
        }));

        var liste = el('div.raster.raster-2');
        eintraege.forEach(function (eintrag) {
          liste.appendChild(el('a.kachel', { href: '#/nachschlagen/' + eintrag.id, style: 'padding:13px' }, [
            el('div.chip-liste', { style: 'margin-bottom:7px' }, [
              el('span.chip.chip-blau.klein', { text: BEREICHE[eintrag.bereich] }),
              el('span.chip.klein', { text: eintrag.kategorie }),
            ]),
            el('h3', { text: eintrag.begriff, style: 'margin-bottom:3px' }),
            el('p.klein.leise', { text: eintrag.kurz, style: 'margin:0' }),
          ]));
        });
        ergebnisBereich.appendChild(liste);
      }

      zeichneBereiche();
      zeichneErgebnis();
    }

    function abschnitteVon(eintrag) {
      var liste = [];
      if (eintrag.funktion) liste.push({ titel: 'Funktionsprinzip', text: eintrag.funktion, punkte: [] });
      if ((eintrag.aufbau || []).length) liste.push({ titel: 'Aufbau', text: '', punkte: eintrag.aufbau });
      if ((eintrag.einsatz || []).length) liste.push({ titel: 'Einsatz und Einbau', text: '', punkte: eintrag.einsatz });
      if ((eintrag.werte || []).length) liste.push({ titel: 'Kennwerte und Richtwerte', text: '', punkte: eintrag.werte });
      if ((eintrag.formeln || []).length) {
        liste.push({
          titel: 'Berechnung', text: '',
          punkte: eintrag.formeln.map(function (f) { return f.name + ': ' + f.formel + ' — ' + f.erklaerung; }),
        });
      }
      if ((eintrag.hinweise || []).length) liste.push({ titel: 'Praxishinweise', text: '', punkte: eintrag.hinweise });
      if ((eintrag.stoerungen || []).length) liste.push({ titel: 'Typische Fehlerbilder', text: '', punkte: eintrag.stoerungen });
      return liste;
    }

    function zeigeEintrag(id) {
      var eintrag = WISSEN_NACH_ID.get(id);
      if (!eintrag) {
        app.appendChild(hinweis('Zu diesem Begriff gibt es keinen Eintrag.', 'fehler'));
        app.appendChild(el('div.knopf-reihe', { style: 'margin-top:12px' }, [
          el('a.knopf.knopf-haupt', { href: '#/nachschlagen', text: 'Zurück zur Suche' }),
        ]));
        return;
      }

      function alsText() {
        return [
          eintrag.begriff, eintrag.kurz, eintrag.funktion,
        ].concat(
          (eintrag.aufbau || []).map(function (x) { return '- ' + x; }),
          (eintrag.einsatz || []).map(function (x) { return '- ' + x; }),
          (eintrag.werte || []).map(function (x) { return '- ' + x; }),
          (eintrag.formeln || []).map(function (f) { return f.name + ': ' + f.formel + ' (' + f.erklaerung + ')'; }),
          (eintrag.hinweise || []).map(function (x) { return '- ' + x; }),
          (eintrag.stoerungen || []).map(function (x) { return '- ' + x; }),
          [(eintrag.normen || []).length ? 'Regelwerke: ' + eintrag.normen.join(', ') : '']
        ).filter(Boolean).join('\n');
      }

      app.appendChild(el('div.knopf-reihe', { style: 'margin-bottom:12px' }, [
        el('a.knopf.knopf-still.knopf-klein', { href: '#/nachschlagen', text: '← Zurück zur Suche' }),
      ]));

      app.appendChild(el('section.karte', {}, [
        el('div.chip-liste', { style: 'margin-bottom:9px' }, [
          el('span.chip.chip-blau', { text: BEREICHE[eintrag.bereich] }),
          el('span.chip', { text: eintrag.kategorie }),
        ]),
        el('h1', { text: eintrag.begriff, style: 'margin-bottom:5px' }),
        el('p', { text: eintrag.kurz, 'data-erklaerbar': '1', style: 'font-size:1.05rem' }),
        (eintrag.synonyme || []).length ? el('p.klein.leise', { text: 'Auch genannt: ' + eintrag.synonyme.join(', ') }) : null,
        el('div.knopf-reihe', { style: 'margin-top:8px' }, [
          el('button.knopf.knopf-haupt', {
            type: 'button', text: KI.da() ? 'Von der KI erklären lassen' : 'Erklärung öffnen',
            onclick: function () { erklaerDialog(eintrag.begriff, {}); },
          }),
          el('button.knopf', { type: 'button', text: '🔊 Vorlesen', onclick: function () {
            if (!vorlesen(alsText())) meldung('Vorlesen geht in diesem Browser nicht.', 'warnung');
          } }),
          el('button.knopf.knopf-still', { type: 'button', text: 'Stopp', onclick: vorlesenStopp }),
          el('button.knopf.knopf-still', { type: 'button', text: 'Text kopieren', onclick: function () { kopiere(alsText()); } }),
          el('button.knopf.knopf-still', {
            type: 'button', text: 'Als Erklärung speichern',
            onclick: function () {
              Speicher.speichern({
                typ: 'erklaerung', titel: eintrag.begriff,
                daten: {
                  begriff: eintrag.begriff, kurz: eintrag.kurz,
                  abschnitte: abschnitteVon(eintrag).map(function (a) { return Object.assign({ id: neueId() }, a); }),
                  normen: eintrag.normen || [],
                  stichworte: (eintrag.verwandt || []).map(function (v) {
                    var e = WISSEN_NACH_ID.get(v);
                    return e ? e.begriff : null;
                  }).filter(Boolean),
                  verlauf: [], tiefe: 1, quelle: 'datenbank',
                },
              }).then(function () { meldung('Unter „Meine Berichte“ gespeichert.', 'erfolg'); })
                .catch(function (f) { meldung(f.message || 'Speichern fehlgeschlagen.', 'fehler'); });
            },
          }),
        ]),
      ]));

      abschnitteVon(eintrag).forEach(function (abschnitt) {
        app.appendChild(el('section.karte', {}, [
          el('div.karte-kopf', {}, [
            el('h2', { text: abschnitt.titel }),
            el('div.rechts', {}, [
              el('button.knopf.knopf-klein.knopf-still', {
                type: 'button', text: 'Genauer erläutern',
                onclick: function () { erklaerDialog(eintrag.begriff + ': ' + abschnitt.titel, {}); },
              }),
            ]),
          ]),
          abschnitt.text ? el('p', { text: abschnitt.text, 'data-erklaerbar': '1' }) : null,
          (abschnitt.punkte || []).length
            ? el('ul', { 'data-erklaerbar': '1', style: 'margin:0;padding-left:19px' },
                abschnitt.punkte.map(function (p) { return el('li', { text: p, style: 'margin-bottom:3px' }); }))
            : null,
        ]));
      });

      (eintrag.vertiefungen || []).forEach(function (v) {
        app.appendChild(el('details.karte', {}, [
          el('summary', { text: v.frage, style: 'cursor:pointer;font-weight:600' }),
          el('p', { text: v.text, 'data-erklaerbar': '1', style: 'margin-top:9px' }),
        ]));
      });

      if ((eintrag.normen || []).length) {
        app.appendChild(el('section.karte', {}, [
          el('div.karte-kopf', {}, [el('h2', { text: 'Regelwerke' })]),
          el('div.chip-liste', {}, eintrag.normen.map(function (n) { return el('span.chip.chip-patina', { text: n }); })),
        ]));
      }

      var verwandte = (eintrag.verwandt || []).map(function (v) { return WISSEN_NACH_ID.get(v); }).filter(Boolean);
      if (verwandte.length) {
        app.appendChild(el('section.karte', {}, [
          el('div.karte-kopf', {}, [el('h2', { text: 'Passt dazu' })]),
          el('div.chip-liste', {}, verwandte.map(function (v) {
            return el('a.chip.chip-blau', { href: '#/nachschlagen/' + v.id, text: v.begriff });
          })),
        ]));
      }
    }

    /* ==================================================================
       Navigation
       ================================================================== */
    var NAV = [
      { pfad: '#/', text: 'Start' },
      { pfad: '#/berichtsheft/neu', text: 'Berichtsheft' },
      { pfad: '#/fachbericht/neu', text: 'Fachbericht' },
      { pfad: '#/erklaeren/neu', text: 'Erklären' },
      { pfad: '#/nachschlagen', text: 'Nachschlagen' },
    ];

    function zeichneNav() {
      var nav = leere($('#nav'));
      var aktuell = location.hash || '#/';
      NAV.forEach(function (punkt) {
        var basis = punkt.pfad.replace('/neu', '');
        var aktiv = aktuell === punkt.pfad || (punkt.pfad !== '#/' && aktuell.indexOf(basis) === 0);
        nav.appendChild(el('a', { href: punkt.pfad, text: punkt.text, 'aria-current': aktiv ? 'page' : null }));
      });
    }

    function route() {
      setzeErklaerHandler(null);
      $('#erklaer-blase').hidden = true;
      overlayZu();
      zeichneNav();

      var teile = (location.hash || '#/').replace(/^#\/?/, '').split('/');
      var bereich = teile[0] || '';
      var id = teile[1] || '';

      try {
        if (bereich === '') ansichtStart();
        else if (bereich === 'berichtsheft') ansichtBerichtsheft(id || 'neu');
        else if (bereich === 'fachbericht') ansichtFachbericht(id || 'neu');
        else if (bereich === 'erklaeren') ansichtErklaeren(id || 'neu');
        else if (bereich === 'nachschlagen') ansichtNachschlagen(id || '');
        else {
          leere(app).appendChild(hinweis('Diese Seite gibt es nicht.', 'warnung'));
          app.appendChild(el('div.knopf-reihe', { style: 'margin-top:12px' }, [
            el('a.knopf.knopf-haupt', { href: '#/', text: 'Zur Startseite' }),
          ]));
        }
      } catch (f) {
        leere(app).appendChild(hinweis(f && f.message ? f.message : 'Unerwarteter Fehler.', 'fehler'));
      }
      window.scrollTo({ top: 0 });
    }

    /* ---------------------------------------------------------- Thema */
    var THEMA = 'shk-thema';
    function themaLesen() {
      try { return localStorage.getItem(THEMA) || 'auto'; } catch (e) { return 'auto'; }
    }
    function themaAnwenden(thema) {
      if (thema === 'auto') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', thema);
      $('#thema').textContent = thema === 'dark' ? '☾' : thema === 'light' ? '☀' : '◐';
      $('#thema').title = thema === 'dark' ? 'Dunkel' : thema === 'light' ? 'Hell' : 'Automatisch';
    }
    $('#thema').addEventListener('click', function () {
      var folge = ['auto', 'light', 'dark'];
      var naechstes = folge[(folge.indexOf(themaLesen()) + 1) % folge.length];
      try { localStorage.setItem(THEMA, naechstes); } catch (e) { /* egal */ }
      themaAnwenden(naechstes);
    });

    /* ---------------------------------------------------------- Start */
    themaAnwenden(themaLesen());
    window.addEventListener('hashchange', route);
    route();

    Plattform.init().then(function () {
      // Ansicht neu aufbauen, sobald KI und Speicher bekannt sind
      route();
    });
  })();
</script>
