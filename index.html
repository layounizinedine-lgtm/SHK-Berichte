<title>SHK-Berichte</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
/>

<style>
  /* ===================================================================
     SHK-Berichte – Blaupause: kühles Papier, Tiefdruckblau, Kupfer.
     Datenblatt-Anmutung: Haarlinien, Versallabels in Mono, Zahlen tabellarisch.
     =================================================================== */

  :root {
    --papier: #eaeff4;
    --flaeche: #ffffff;
    --flaeche-2: #f4f7fa;
    --flaeche-3: #e7edf3;
    --tinte: #0f2230;
    --tinte-leise: #55697b;
    --linie: #d2dce5;
    --linie-stark: #b3c3d1;
    --blau: #15618f;
    --blau-flaeche: #e2eef7;
    --blau-text: #ffffff;
    --kupfer: #a2571f;
    --kupfer-flaeche: #f8ebe0;
    --patina: #1a7560;
    --patina-flaeche: #e0f1ec;
    --rot: #ad3527;
    --rot-flaeche: #fbe9e6;
    --schatten: 0 1px 1px rgba(15, 34, 48, 0.04), 0 10px 24px rgba(15, 34, 48, 0.07);
    --schatten-hoch: 0 2px 6px rgba(15, 34, 48, 0.1), 0 22px 48px rgba(15, 34, 48, 0.16);
    --rund: 12px;
    --rund-klein: 8px;
    --breite: 1180px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --papier: #0b141c;
      --flaeche: #131f29;
      --flaeche-2: #18262f;
      --flaeche-3: #1f3140;
      --tinte: #e4edf4;
      --tinte-leise: #91a5b5;
      --linie: #223545;
      --linie-stark: #31506a;
      --blau: #61aee4;
      --blau-flaeche: #14303f;
      --blau-text: #071620;
      --kupfer: #dd9058;
      --kupfer-flaeche: #2f2118;
      --patina: #48bd9a;
      --patina-flaeche: #102d27;
      --rot: #ef8175;
      --rot-flaeche: #30191a;
      --schatten: 0 1px 1px rgba(0, 0, 0, 0.5), 0 10px 26px rgba(0, 0, 0, 0.42);
      --schatten-hoch: 0 2px 8px rgba(0, 0, 0, 0.55), 0 24px 52px rgba(0, 0, 0, 0.55);
    }
  }

  :root[data-theme='dark'] {
    --papier: #0b141c;
    --flaeche: #131f29;
    --flaeche-2: #18262f;
    --flaeche-3: #1f3140;
    --tinte: #e4edf4;
    --tinte-leise: #91a5b5;
    --linie: #223545;
    --linie-stark: #31506a;
    --blau: #61aee4;
    --blau-flaeche: #14303f;
    --blau-text: #071620;
    --kupfer: #dd9058;
    --kupfer-flaeche: #2f2118;
    --patina: #48bd9a;
    --patina-flaeche: #102d27;
    --rot: #ef8175;
    --rot-flaeche: #30191a;
    --schatten: 0 1px 1px rgba(0, 0, 0, 0.5), 0 10px 26px rgba(0, 0, 0, 0.42);
    --schatten-hoch: 0 2px 8px rgba(0, 0, 0, 0.55), 0 24px 52px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--papier);
    color: var(--tinte);
    font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 15.5px;
    line-height: 1.55;
  }

  h1, h2, h3 {
    font-family: 'IBM Plex Sans Condensed', 'IBM Plex Sans', system-ui, sans-serif;
    font-weight: 700;
    letter-spacing: -0.005em;
    line-height: 1.2;
    margin: 0 0 0.35em;
    text-wrap: balance;
  }
  h1 { font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.3rem); }
  h2 { font-size: clamp(1.15rem, 1rem + 0.7vw, 1.45rem); }
  h3 { font-size: 1.05rem; }
  p { margin: 0 0 0.75em; }
  a { color: var(--blau); }

  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .leise { color: var(--tinte-leise); }
  .klein { font-size: 0.86rem; }

  /* ------------------------------------------------------------- Kopf */
  .kopf {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 40;
    background: color-mix(in srgb, var(--flaeche) 90%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--linie);
  }
  .kopf-innen {
    max-width: var(--breite);
    margin: 0 auto;
    padding: 9px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    row-gap: 6px;
  }
  .marke {
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: 'IBM Plex Sans Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.08rem;
    color: var(--tinte);
    text-decoration: none;
    letter-spacing: 0.01em;
  }
  .marke svg { display: block; }
  .nav {
    display: flex;
    gap: 3px;
    overflow-x: auto;
    scrollbar-width: none;
    order: 3;
    width: 100%;
  }
  .nav::-webkit-scrollbar { display: none; }
  .nav a {
    padding: 6px 11px;
    border-radius: 999px;
    text-decoration: none;
    color: var(--tinte-leise);
    font-size: 0.9rem;
    font-weight: 500;
    white-space: nowrap;
    background: var(--flaeche-3);
  }
  .nav a[aria-current='page'] { background: var(--blau); color: var(--blau-text); }
  .kopf-rechts { margin-left: auto; display: flex; align-items: center; gap: 6px; }

  @media (min-width: 760px) {
    .nav { order: 0; width: auto; background: none; }
    .nav a { background: none; }
    .nav a:hover { background: var(--flaeche-3); color: var(--tinte); }
  }

  main {
    max-width: var(--breite);
    margin: 0 auto;
    padding-block: 20px 120px;
    padding-inline: 16px;
  }

  /* ------------------------------------------------------------- Bausteine */
  .karte {
    background: var(--flaeche);
    border: 1px solid var(--linie);
    border-radius: var(--rund);
    box-shadow: var(--schatten);
    padding: 16px;
  }
  .karte + .karte { margin-top: 14px; }

  .karte-kopf { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .karte-kopf h2, .karte-kopf h3 { margin: 0; }
  .karte-kopf .rechts { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }

  .label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--tinte-leise);
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 8px;
  }
  .label::after { content: ''; flex: 1; height: 1px; background: var(--linie); }

  .raster { display: grid; gap: 14px; }
  @media (min-width: 820px) {
    .raster-2 { grid-template-columns: 1fr 1fr; }
    .raster-3 { grid-template-columns: repeat(3, 1fr); }
  }

  button { font: inherit; cursor: pointer; }
  .knopf {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 1px solid var(--linie-stark);
    background: var(--flaeche);
    color: var(--tinte);
    border-radius: var(--rund-klein);
    padding: 8px 13px;
    font-size: 0.9rem;
    font-weight: 500;
    text-decoration: none;
    white-space: nowrap;
    transition: background 0.14s ease, border-color 0.14s ease, transform 0.06s ease;
  }
  .knopf:hover { background: var(--flaeche-3); }
  .knopf:active { transform: translateY(1px); }
  .knopf:disabled { opacity: 0.5; cursor: not-allowed; }
  .knopf-haupt { background: var(--blau); border-color: var(--blau); color: var(--blau-text); font-weight: 600; }
  .knopf-haupt:hover { background: color-mix(in srgb, var(--blau) 86%, #000); }
  .knopf-kupfer { background: var(--kupfer); border-color: var(--kupfer); color: #fff; }
  .knopf-kupfer:hover { background: color-mix(in srgb, var(--kupfer) 86%, #000); }
  .knopf-still { border-color: transparent; background: transparent; color: var(--tinte-leise); }
  .knopf-still:hover { background: var(--flaeche-3); color: var(--tinte); }
  .knopf-gefahr { color: var(--rot); border-color: color-mix(in srgb, var(--rot) 40%, var(--linie)); }
  .knopf-gefahr:hover { background: var(--rot-flaeche); }
  .knopf-klein { padding: 4px 8px; font-size: 0.8rem; border-radius: 6px; }
  .knopf-reihe { display: flex; gap: 7px; flex-wrap: wrap; }

  input[type='text'], input[type='search'], textarea, select {
    width: 100%;
    font: inherit;
    color: var(--tinte);
    background: var(--flaeche-2);
    border: 1px solid var(--linie-stark);
    border-radius: var(--rund-klein);
    padding: 9px 11px;
  }
  textarea { resize: vertical; min-height: 88px; line-height: 1.5; }
  :focus-visible { outline: 2px solid var(--blau); outline-offset: 2px; }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--flaeche-3);
    border: 1px solid var(--linie);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 0.8rem;
    color: var(--tinte);
    text-decoration: none;
    appearance: none;
    font-family: inherit;
  }
  button.chip { cursor: pointer; }
  .chip-liste { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip button { border: 0; background: none; color: var(--tinte-leise); padding: 0 1px; line-height: 1; font-size: 0.95rem; }
  .chip button:hover { color: var(--rot); }
  .chip-blau { background: var(--blau-flaeche); border-color: color-mix(in srgb, var(--blau) 30%, transparent); color: var(--blau); }
  .chip-kupfer { background: var(--kupfer-flaeche); border-color: color-mix(in srgb, var(--kupfer) 30%, transparent); color: var(--kupfer); }
  .chip-patina { background: var(--patina-flaeche); border-color: color-mix(in srgb, var(--patina) 30%, transparent); color: var(--patina); }

  /* ------------------------------------------------------------- Diktat */
  .diktat { border: 1px solid var(--linie); border-radius: var(--rund); background: var(--flaeche); box-shadow: var(--schatten); padding: 15px; }
  .diktat-kopf { display: flex; align-items: center; gap: 13px; flex-wrap: wrap; }
  .mikro {
    width: 58px; height: 58px; border-radius: 50%; border: 0; flex: none;
    background: var(--blau); color: var(--blau-text);
    display: grid; place-items: center;
    box-shadow: 0 5px 16px color-mix(in srgb, var(--blau) 34%, transparent);
  }
  .mikro svg { width: 24px; height: 24px; }
  .mikro[data-aktiv='true'] { background: var(--rot); color: #fff; animation: puls 1.7s ease-in-out infinite; }
  @keyframes puls {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--rot) 50%, transparent); }
    55% { box-shadow: 0 0 0 13px rgba(0, 0, 0, 0); }
  }
  @media (prefers-reduced-motion: reduce) { .mikro[data-aktiv='true'] { animation: none; } }
  .diktat-text { flex: 1 1 240px; min-width: 0; }
  .zwischen { min-height: 1.3em; font-size: 0.85rem; color: var(--tinte-leise); font-style: italic; }

  /* ------------------------------------------------------------- Punkte */
  .punkte { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
  .punkt {
    display: flex; align-items: flex-start; gap: 9px;
    background: var(--flaeche-2); border: 1px solid var(--linie);
    border-radius: var(--rund-klein); padding: 9px 11px;
  }
  .punkt[data-gewaehlt='true'] { border-color: var(--blau); background: var(--blau-flaeche); }
  .punkt input[type='checkbox'] { margin-top: 4px; width: 17px; height: 17px; accent-color: var(--blau); flex: none; }
  .punkt-inhalt { flex: 1 1 auto; min-width: 0; }
  .punkt-text { outline: none; word-break: break-word; }
  .punkt-text[contenteditable='true']:focus { background: var(--flaeche); border-radius: 5px; box-shadow: 0 0 0 2px var(--blau); }
  .punkt-werkzeuge { display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; flex: none; }
  .punkt-zusatz {
    margin-top: 7px; padding: 9px 11px; font-size: 0.9rem;
    border-left: 3px solid var(--kupfer); background: var(--kupfer-flaeche);
    border-radius: 0 var(--rund-klein) var(--rund-klein) 0; white-space: pre-wrap;
  }
  @media (max-width: 720px) {
    .punkt { flex-wrap: wrap; }
    .punkt-inhalt { flex: 1 1 calc(100% - 36px); }
    .punkt-werkzeuge { width: 100%; justify-content: flex-start; padding-left: 26px; }
  }

  .auswahl-leiste {
    position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 30;
    display: flex; gap: 7px; align-items: center; flex-wrap: wrap;
    background: var(--flaeche); border: 1px solid var(--blau);
    border-radius: var(--rund); padding: 9px 11px; box-shadow: var(--schatten-hoch); margin: 12px 0;
  }

  /* ------------------------------------------------------------- Tabellen */
  .tabelle { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  .tabelle th, .tabelle td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--linie); vertical-align: top; }
  .tabelle th {
    font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--tinte-leise); font-weight: 500;
  }
  .tabelle-rahmen { overflow-x: auto; }

  /* ------------------------------------------------------------- Kacheln */
  .kachel {
    display: block; text-decoration: none; color: inherit;
    background: var(--flaeche); border: 1px solid var(--linie);
    border-radius: var(--rund); padding: 16px; box-shadow: var(--schatten);
    transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
  }
  .kachel:hover { transform: translateY(-2px); box-shadow: var(--schatten-hoch); border-color: var(--blau); }
  .kachel-zeichen {
    width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
    margin-bottom: 10px; background: var(--blau-flaeche); color: var(--blau);
  }
  .kachel-kupfer .kachel-zeichen { background: var(--kupfer-flaeche); color: var(--kupfer); }
  .kachel-patina .kachel-zeichen { background: var(--patina-flaeche); color: var(--patina); }
  .kachel h3 { margin-bottom: 3px; }

  .zeile {
    display: flex; align-items: center; gap: 11px;
    padding: 10px 0; border-bottom: 1px solid var(--linie);
  }
  .zeile:last-child { border-bottom: 0; }
  .zeile .titel { font-weight: 600; color: var(--tinte); text-decoration: none; }
  .zeile .titel:hover { color: var(--blau); }

  /* ------------------------------------------------------------- Hinweise */
  .hinweis {
    display: flex; gap: 9px; align-items: flex-start;
    border: 1px solid var(--linie); background: var(--flaeche-2);
    border-radius: var(--rund-klein); padding: 10px 12px; font-size: 0.9rem;
  }
  .hinweis-info { background: var(--blau-flaeche); border-color: color-mix(in srgb, var(--blau) 28%, transparent); }
  .hinweis-warnung { background: var(--kupfer-flaeche); border-color: color-mix(in srgb, var(--kupfer) 30%, transparent); }
  .hinweis-fehler { background: var(--rot-flaeche); border-color: color-mix(in srgb, var(--rot) 30%, transparent); }
  .hinweis-erfolg { background: var(--patina-flaeche); border-color: color-mix(in srgb, var(--patina) 30%, transparent); }

  .zeichnung { border: 1px solid var(--linie); border-radius: var(--rund-klein); background: var(--flaeche-2); padding: 11px; overflow-x: auto; color: var(--tinte); }
  .zeichnung svg { max-width: 100%; height: auto; display: block; }

  .leer { text-align: center; padding: 28px 14px; color: var(--tinte-leise); }

  /* ------------------------------------------------------------- Meldungen */
  #meldungen {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 90;
    display: grid; gap: 7px; width: min(520px, calc(100vw - 28px)); pointer-events: none;
  }
  .meldung {
    background: var(--flaeche); border: 1px solid var(--linie-stark); border-left: 4px solid var(--blau);
    border-radius: var(--rund-klein); box-shadow: var(--schatten-hoch); padding: 9px 12px; font-size: 0.9rem;
    animation: rein 0.16s ease;
  }
  .meldung-fehler { border-left-color: var(--rot); }
  .meldung-erfolg { border-left-color: var(--patina); }
  .meldung-warnung { border-left-color: var(--kupfer); }
  @keyframes rein { from { opacity: 0; transform: translateY(7px); } }

  .laden {
    display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor;
    border-right-color: transparent; border-radius: 50%; animation: dreh 0.7s linear infinite; vertical-align: -2px;
  }
  @keyframes dreh { to { transform: rotate(360deg); } }
  .arbeitet { display: flex; align-items: center; gap: 9px; color: var(--tinte-leise); font-size: 0.9rem; padding: 8px 0; }

  /* ------------------------------------------------------------- Overlay */
  /* Ausgeblendetes schlägt jede Display-Regel – auch ohne Plattform-Reset */
  [hidden] { display: none !important; }

  #overlay {
    position: fixed; inset: 0; z-index: 80; background: rgba(6, 16, 24, 0.55);
    display: grid; place-items: center; padding: 16px;
  }
  .overlay-karte {
    background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--rund);
    box-shadow: var(--schatten-hoch); width: min(660px, 100%); max-height: min(86vh, 900px); overflow-y: auto; padding: 18px;
  }

  #erklaer-blase { position: absolute; z-index: 60; }

  /* ------------------------------------------------------------- Drucken */
  @media print {
    .kopf, .diktat, .auswahl-leiste, .punkt-werkzeuge, .knopf-reihe, #meldungen,
    .nicht-drucken, .punkt input[type='checkbox'], #erklaer-blase { display: none !important; }
    body { background: #fff; color: #000; }
    main { max-width: none; padding: 0; }
    .karte { border: 0; box-shadow: none; padding: 0; page-break-inside: avoid; }
    .punkt { background: none; border: 0; padding: 2px 0; }
  }
</style>

<header class="kopf">
  <div class="kopf-innen">
    <a class="marke" href="#/">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <rect x="0.5" y="0.5" width="25" height="25" rx="7" fill="var(--blau)" />
        <path d="M6 8.5h9a3.5 3.5 0 0 1 0 7H9.5" stroke="#fff" stroke-width="2" stroke-linecap="round" />
        <circle cx="19.5" cy="18" r="2.6" stroke="var(--kupfer)" stroke-width="2" fill="none" />
        <path d="M6 18h8" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.75" />
      </svg>
      <span>SHK&#8209;Berichte</span>
    </a>
    <nav class="nav" id="nav" aria-label="Bereiche"></nav>
    <div class="kopf-rechts">
      <button class="chip mono klein" id="ki-status" type="button" title="API-Schlüssel &amp; Einstellungen">…</button>
      <button class="knopf knopf-still knopf-klein" id="einstellungen" type="button" title="Einstellungen">⚙</button>
      <button class="knopf knopf-still knopf-klein" id="thema" type="button" title="Hell / Dunkel">◐</button>
    </div>
  </div>
</header>

<main id="app">
  <div class="arbeitet"><span class="laden"></span> Wird geladen …</div>
</main>

<div id="meldungen" role="status" aria-live="polite"></div>
<div id="erklaer-blase" hidden>
  <button class="knopf knopf-haupt knopf-klein" id="erklaer-knopf" type="button">Begriff erklären</button>
</div>
<div id="overlay" hidden><div class="overlay-karte" id="overlay-inhalt"></div></div>

<script>
  (function () {
    'use strict';

    /* ==================================================================
       Teil 1 – Fachsprache-Engine und Fachdatenbank
       (aus server/ai/ übernommen, siehe webapp/build.mjs)
       ================================================================== */

    /* ---------- server/ai/glossar.js ---------- */
/**
 * SHK-Fachglossar
 * ---------------------------------------------------------------------------
 * Grundlage für die Umschreibung von Umgangssprache in Fachsprache.
 * Wird zweifach genutzt:
 *   1. lokal von der Fachsprache-Engine (auch ohne KI-Schlüssel)
 *   2. als Referenz im Systemprompt, damit die KI die Betriebsbegriffe
 *      des Anlagenmechanikers SHK zuverlässig trifft.
 */

/** Wandstärken-Tabellen für die gängigen Rohrwerkstoffe (Außendurchmesser → Wandstärke). */
const WANDSTAERKEN = {
  kupfer: { 12: '1,0', 15: '1,0', 18: '1,0', 22: '1,0', 28: '1,5', 35: '1,5', 42: '1,5', 54: '2,0', 64: '2,0', 76: '2,0' },
  edelstahl: { 15: '1,0', 18: '1,0', 22: '1,2', 28: '1,2', 35: '1,5', 42: '1,5', 54: '1,5', 76: '2,0' },

/**
 * Fachdatenbank Anlagenmechanik SHK / Versorgungstechnik
 * ---------------------------------------------------------------------------
 * Strukturierte Wissensbasis über alle Bereiche des Berufsfeldes.
 * Sie wird dreifach genutzt:
 *   1. Nachschlagewerk in der App (Suche, Bereiche, Detailansicht)
 *   2. Grundlage für Erklärungen im Fachmodus offline
 *   3. Faktenblock im KI-Prompt, damit die KI mit den gleichen Werten,
 *      Normen und Formeln arbeitet wie das Nachschlagewerk
 *
 * Aufbau eines Eintrags:
 *   id          eindeutiger Schlüssel (klein, ohne Umlaute)
 *   begriff     Anzeigename
 *   bereich     sanitaer | heizung | gas | lueftung | versorgung | grundlagen
 *   kategorie   Bauteil | Anlage | Werkstoff | Verfahren | Regelwerk | Berechnung | Sicherheit | Grundlagen
 *   synonyme[]  Umgangssprache, Abkürzungen, Schreibvarianten
 *   kurz        Definition in ein bis zwei Sätzen
 *   funktion    Funktionsprinzip / Zusammenhang als Fließtext
 *   aufbau[]    Bestandteile
 *   einsatz[]   Einsatzorte und Anwendungsfälle
 *   hinweise[]  Praxis-, Montage- und Wartungshinweise
 *   stoerungen[]typische Fehlerbilder mit Ursache
 *   werte[]     Kennwerte und Richtwerte
 *   formeln[]   { name, formel, erklaerung }
 *   normen[]    einschlägige Regelwerke
 *   verwandt[]  ids verwandter Einträge
 *   vertiefungen[] { frage, text } – Antworten auf typische Rückfragen
 */







const BEREICHE = {
  grundlagen: 'Grundlagen und Werkstoffe',
  sanitaer: 'Sanitär- und Trinkwassertechnik',
  heizung: 'Heizungstechnik',
  gas: 'Gastechnik',
  lueftung: 'Lüftung, Klima und Kälte',
  versorgung: 'Versorgungs- und Anlagentechnik',
};

/** Alle Einträge in einer Liste. */
const WISSENSBASIS = [...GRUNDLAGEN, ...SANITAER, ...HEIZUNG, ...GAS, ...LUEFTUNG, ...VERSORGUNG];

/** Schnellzugriff über die id. */
const WISSEN_NACH_ID = new Map(WISSENSBASIS.map((e) => [e.id, e]));

/* -------------------------------------------------------------------------- */
/* Suche                                                                      */
/* -------------------------------------------------------------------------- */

const STOPPWOERTER = new Set([
  'der', 'die', 'das', 'den', 'dem', 'des', 'ein', 'eine', 'einen', 'einem', 'einer', 'eines',
  'und', 'oder', 'ist', 'sind', 'was', 'wie', 'wer', 'wo', 'wozu', 'wofuer', 'fuer', 'von', 'mit',
  'bitte', 'mir', 'uns', 'mal', 'erklaere', 'erklaer', 'erklaeren', 'erlaeutere', 'erlaeuter',
  'bedeutet', 'genau', 'dient', 'funktioniert', 'zeige', 'sag', 'sage',
]);

/** Text für den Vergleich vereinheitlichen (Umlaute, Sonderzeichen, Kleinschreibung). */
function schluessel(text) {
  return String(text || '')
    .toLowerCase()
    .replace(/ä/g, 'ae')
    .replace(/ö/g, 'oe')
    .replace(/ü/g, 'ue')
    .replace(/ß/g, 'ss')
    .replace(/[^a-z0-9]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function woerter(text) {
  return schluessel(text)
    .split(' ')
    .filter((w) => w.length > 2 && !STOPPWOERTER.has(w));
}

/** Volltext eines Eintrags für die Suche. */
function volltext(eintrag) {
  return schluessel(
    [
      eintrag.begriff,
      ...(eintrag.synonyme || []),
      eintrag.kurz,
      eintrag.funktion,
      ...(eintrag.aufbau || []),
      ...(eintrag.einsatz || []),
      ...(eintrag.hinweise || []),
      ...(eintrag.stoerungen || []),
      ...(eintrag.werte || []),
      ...(eintrag.normen || []),
      ...(eintrag.formeln || []).map((f) => `${f.name} ${f.formel} ${f.erklaerung}`),
      ...(eintrag.vertiefungen || []).map((v) => `${v.frage} ${v.text}`),
    ]
      .filter(Boolean)
      .join(' '),
  );
}

const VOLLTEXT = new Map(WISSENSBASIS.map((e) => [e.id, volltext(e)]));
const BEGRIFF_SCHLUESSEL = new Map(WISSENSBASIS.map((e) => [e.id, schluessel(e.begriff)]));
const SYNONYM_SCHLUESSEL = new Map(
  WISSENSBASIS.map((e) => [e.id, (e.synonyme || []).map((s) => schluessel(s))]),
);

/**
 * Bewertet, wie gut ein Eintrag zur Anfrage passt.
 * Höhere Zahl = besserer Treffer, 0 = kein Treffer.
 */
function bewerte(eintrag, anfrage, anfrageWoerter) {
  const begriff = BEGRIFF_SCHLUESSEL.get(eintrag.id);
  const synonyme = SYNONYM_SCHLUESSEL.get(eintrag.id);
  const text = VOLLTEXT.get(eintrag.id);
  let punkte = 0;

  if (anfrage === eintrag.id || anfrage === begriff) punkte += 120;
  else if (synonyme.includes(anfrage)) punkte += 100;

  if (anfrage.length > 2) {
    if (begriff.includes(anfrage)) punkte += 55;
    else if (anfrage.includes(begriff) && begriff.length > 4) punkte += 45;
    // Synonym nur werten, wenn es als ganzes Wort (bzw. ganze Wortfolge) vorkommt
    const anfrageWoerterMenge = new Set(anfrage.split(' '));
    if (
      synonyme.some(
        (s) =>
          s.length > 2 &&
          (s === anfrage || anfrageWoerterMenge.has(s) || (s.includes(' ') && anfrage.includes(s)) || s.includes(anfrage)),
      )
    ) {
      punkte += 35;
    }
  }

  for (const wort of anfrageWoerter) {
    if (begriff.includes(wort)) punkte += 14;
    else if (synonyme.some((s) => s.includes(wort))) punkte += 10;
    else if (text.includes(wort)) punkte += 3;
  }

  return punkte;
}

/**
 * Sucht in der Fachdatenbank.
 * @param {string} anfrage
 * @param {object} [o]
 * @param {number} [o.grenze] maximale Trefferzahl
 * @param {string} [o.bereich] nur dieser Bereich
 */
function sucheWissen(anfrage, { grenze = 12, bereich } = {}) {
  const a = schluessel(anfrage);
  const aw = woerter(anfrage);
  const grundmenge = bereich ? WISSENSBASIS.filter((e) => e.bereich === bereich) : WISSENSBASIS;

  if (!a) {
    return grundmenge.slice(0, grenze).map((eintrag) => ({ eintrag, punkte: 0 }));
  }

  return grundmenge
    .map((eintrag) => ({ eintrag, punkte: bewerte(eintrag, a, aw) }))
    .filter((t) => t.punkte > 0)
    .sort((x, y) => y.punkte - x.punkte || x.eintrag.begriff.localeCompare(y.eintrag.begriff, 'de'))
    .slice(0, grenze);
}

/** Bester Treffer zu einem Begriff oder null. */
function findeWissen(begriff) {
  const direkt = WISSEN_NACH_ID.get(schluessel(begriff).replace(/ /g, '_'));
  if (direkt) return direkt;
  const treffer = sucheWissen(begriff, { grenze: 1 });
  if (!treffer.length) return null;
  // Zu schwache Treffer (nur ein Wort im Fließtext) gelten nicht als Erklärung.
  return treffer[0].punkte >= 14 ? treffer[0].eintrag : null;
}

/** Mehrere passende Einträge, z. B. für den Faktenblock im KI-Prompt. */
function findeMehrere(text, anzahl = 4) {
  return sucheWissen(text, { grenze: anzahl })
    .filter((t) => t.punkte >= 20)
    .map((t) => t.eintrag);
}

/** Kurzübersicht für Listen in der App. */
function uebersicht(eintrag) {
  return {
    id: eintrag.id,
    begriff: eintrag.begriff,
    bereich: eintrag.bereich,
    bereichName: BEREICHE[eintrag.bereich] || eintrag.bereich,
    kategorie: eintrag.kategorie,
    kurz: eintrag.kurz,
  };
}

/** Eintrag mit aufgelösten Verweisen. */
function vollstaendig(eintrag) {
  return {
    ...eintrag,
    bereichName: BEREICHE[eintrag.bereich] || eintrag.bereich,
    verwandteEintraege: (eintrag.verwandt || [])
      .map((id) => WISSEN_NACH_ID.get(id))
      .filter(Boolean)
      .map((e) => ({ id: e.id, begriff: e.begriff })),
  };
}

/**
 * Faktenblock für den KI-Prompt: verdichtete Angaben aus der Datenbank,
 * damit KI-Texte dieselben Werte und Regelwerke verwenden.
 */
function faktenBlock(text, anzahl = 3) {
  const treffer = findeMehrere(text, anzahl);
  if (!treffer.length) return '';
  const bloecke = treffer.map((e) => {
    const zeilen = [`### ${e.begriff} (${BEREICHE[e.bereich]})`, e.kurz];
    if (e.funktion) zeilen.push(`Funktion: ${e.funktion}`);
    if (e.werte?.length) zeilen.push(`Kennwerte: ${e.werte.join('; ')}`);
    if (e.formeln?.length) zeilen.push(`Formeln: ${e.formeln.map((f) => `${f.name}: ${f.formel}`).join('; ')}`);
    if (e.hinweise?.length) zeilen.push(`Praxis: ${e.hinweise.slice(0, 3).join('; ')}`);
    if (e.normen?.length) zeilen.push(`Regelwerke: ${e.normen.join(', ')}`);
    return zeilen.join('\n');
  });
  return [
    'Auszug aus der betrieblichen Fachdatenbank – diese Angaben sind verbindlich und dürfen nicht durch andere Werte ersetzt werden:',
    ...bloecke,
  ].join('\n\n');
}

/** Statistik für Startseite und Tests. */
function statistik() {
  const nachBereich = {};
  for (const e of WISSENSBASIS) nachBereich[e.bereich] = (nachBereich[e.bereich] || 0) + 1;
  return { gesamt: WISSENSBASIS.length, nachBereich };
}

/**
 * Fachsprache-Engine
 * ---------------------------------------------------------------------------
 * Wandelt Umgangssprache ("100er SML mit der Flex geschnitten") in
 * SHK-Fachsprache ("SML-Abflussrohr DN 100 mit dem Winkelschleifer abgelaengt").
 *
 * Arbeitet vollstaendig lokal. Das Ergebnis dient zugleich als Hinweis-Block
 * fuer den KI-Prompt, damit die KI die Betriebsbegriffe sicher trifft.
 */



// Platzhalter-Marker: Zeichen, die in normalem Text nicht vorkommen und von
// keiner Folgeregel getroffen werden (verhindert Mehrfachersetzung).
const PH_START = String.fromCharCode(1);
const PH_END = String.fromCharCode(2);

function escapeRegExp(text) {
  return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

/** Wandstärke zu einem Außendurchmesser aus der Werkstofftabelle. */
function wandstaerke(werkstoff, durchmesser) {
  const tabelle = WANDSTAERKEN[werkstoff];
  if (!tabelle) return null;
  return tabelle[durchmesser] || null;
}

function rohrText(werkstoff, dm) {
  const w = wandstaerke(werkstoff, dm);
  const masse = w ? `${dm} x ${w} mm` : `${dm} mm`;
  switch (werkstoff) {
    case 'kupfer':
      return `Kupferrohr ${masse} (DIN EN 1057)`;
    case 'edelstahl':
      return `Edelstahlrohr ${masse} (1.4401, Pressfittingsystem)`;
    case 'cstahl':
      return `C-Stahlrohr ${masse}, außen verzinkt`;
    case 'verbundrohr':
      return `Mehrschichtverbundrohr ${masse}`;
    case 'praezisionsstahl':
      return `Präzisionsstahlrohr ${masse}`;
    default:
      return `Rohr ${masse}`;
  }
}

 * Dimensionsregeln. Reihenfolge ist wichtig: spezielle Regeln zuerst.

  {
    re: /\b(\d{2})\s*(?:x|mal)\s*(\d(?:[,.]\d)?)\s*(?:mm)?\b/gi,
    fach: (m) => `${m[1]} x ${String(m[2]).replace('.', ',')} mm`,
    kategorie: 'dimension',
  },
  // blanke DN-Angabe
  {
    re: /\bd\.?\s?n\.?\s*(\d{2,3})\b/gi,
    fach: (m) => `DN ${m[1]}`,
    kategorie: 'dimension',
  },
  // "80er Rohr" ohne Werkstoff
  {
    re: /\b(\d{2,3})\s*er\s*(?:rohr|leitung)\b/gi,
    fach: (m) => (Number(m[1]) >= 40 ? `Rohr DN ${m[1]}` : `Rohr ${m[1]} mm`),
    kategorie: 'dimension',
  },
];

/** Gesprochene Zoll-Angaben in "DN 20 (3/4 Zoll)" wandeln. */
function zollErsetzen(text, treffer, merke) {
  let out = text;
  for (const [re, zoll] of ZOLL_SPRACHE) {
    out = out.replace(re, (roh) => {
      const dn = ZOLL_DN[zoll];
      const fach = dn ? `DN ${dn} (${zoll} Zoll)` : `${zoll} Zoll`;
      treffer.push({ roh: roh.trim(), fach, kategorie: 'dimension' });
      return merke(fach);
    });
  }
  return out;
}

// Ältere Browser (Safari vor 16.4) kennen keinen Lookbehind – dann wird das
// Zeichen vor dem Begriff als Gruppe mitgenommen und wieder eingesetzt.
const LOOKBEHIND_MOEGLICH = (() => {
  try {
    new RegExp('(?<!x)y');
    return true;
  } catch {
    return false;
  }
})();

function aliasRegel(alias) {
  const kern = escapeRegExp(alias).replace(/\s+/g, '\\s+');
  const ende = '(?:s|n|en|e)?(?![\\wäöüßÄÖÜ])';
  return LOOKBEHIND_MOEGLICH
    ? new RegExp(`(?<![\\wäöüßÄÖÜ])${kern}${ende}`, 'gi')
    : new RegExp(`(^|[^\\wäöüßÄÖÜ])${kern}${ende}`, 'gi');
}

/** Glossar-Regeln aus den Aliassen erzeugen (längste Aliasse zuerst). */
const GLOSSAR_REGELN = GLOSSAR.flatMap((eintrag) =>
  eintrag.aliases.map((alias) => ({
    alias,
    laenge: alias.length,
    re: aliasRegel(alias),
    eintrag,
  })),
).sort((a, b) => b.laenge - a.laenge);

/** Grobe Genus-Bestimmung, damit "mit einer Flex" zu "mit dem Winkelschleifer" wird. */
function dativArtikel(begriff) {
  const kopf = String(begriff).split(/[\s(,/]/)[0].toLowerCase().replace(/-/g, '');
  if (
    /(maschine|zange|säge|pumpe|waage|kluppe|presse|schere|leitung|anlage|prüfung|probe|installation|dämmung|bohrung|schelle|stange|schiene|manschette|wanne|uhr|lampe|matte|station|gruppe|klappe|hülse|scheibe|kette|armatur|einrichtung)$/.test(
      kopf,
    )
  ) {
    return 'der';
  }
  return 'dem';
}

/** Kleine sprachliche Korrekturen nach dem Ersetzen. */
function nachbearbeitung(text, treffer) {
  let out = text;
  const begriffe = [...new Set(treffer.filter((t) => t.kategorie === 'werkzeug' || t.kategorie === 'bauteil').map((t) => t.fach))];
  for (const fach of begriffe) {
    const re = new RegExp(`\\bmit\\s+(?:einer|einem|eine|ein|nem|ner|meiner|meinem|der|dem|den)\\s+${escapeRegExp(fach)}`, 'gi');
    out = out.replace(re, `mit ${dativArtikel(fach)} ${fach}`);
  }
  return out
    .replace(/\s{2,}/g, ' ')
    .replace(/\s+([,.;:])/g, '$1')
    .trim();
}

/**
 * Hauptfunktion: normalisiert einen gesprochenen Text.
 * @param {string} eingabe Rohtext aus der Spracherkennung
 */
function normalisiere(eingabe) {
  const treffer = [];
  const platzhalter = [];
  const merke = (wert) => {
    platzhalter.push(wert);
    return `${PH_START}${platzhalter.length - 1}${PH_END}`;
  };

  let text = String(eingabe || '').replace(/\s+/g, ' ').trim();

  // 1. Zoll-Angaben
  text = zollErsetzen(text, treffer, merke);

  // 2. Dimensions- und Werkstoffregeln
  for (const regel of DIMENSIONS_REGELN) {
    text = text.replace(regel.re, (...args) => {
      const m = args.slice(0, -2);
      const fach = regel.fach(m);
      treffer.push({ roh: m[0].trim(), fach, kategorie: regel.kategorie, werkstoff: regel.werkstoff });
      return merke(fach);
    });
  }

  // 3. Begriffsglossar
  for (const regel of GLOSSAR_REGELN) {
    text = text.replace(regel.re, (...args) => {
      const roh = String(args[0]);
      const vorsatz = LOOKBEHIND_MOEGLICH ? '' : String(args[1] || '');
      treffer.push({
        roh: roh.slice(vorsatz.length).trim(),
        fach: regel.eintrag.fach,
        kategorie: regel.eintrag.kategorie,
        eintrag: regel.eintrag,
      });
      return vorsatz + merke(regel.eintrag.fach);
    });
  }

  // 4. Platzhalter auflösen
  text = text.replace(new RegExp(`${PH_START}(\\d+)${PH_END}`, 'g'), (_, i) => platzhalter[Number(i)]);
  text = nachbearbeitung(text, treffer);

  const werkzeug = new Set();
  const material = new Set();
  const normen = new Set();
  const hinweise = new Set();

  for (const t of treffer) {
    const e = t.eintrag;
    if (!e) continue;
    (e.werkzeug || []).forEach((w) => werkzeug.add(w));
    (e.material || []).forEach((w) => material.add(w));
    (e.normen || []).forEach((w) => normen.add(w));
    if (e.hinweis) hinweise.add(e.hinweis);
  }

  // Werkstoffabhängige Listen ergänzen
  for (const t of treffer) {
    if (t.kategorie !== 'rohr') continue;
    material.add(t.fach);
    if (t.werkstoff === 'sml') {
      material.add('CV-/Rapid-Verbinder mit Edelstahlmantel in passender Nennweite');
      werkzeug.add('Winkelschleifer mit Trennscheibe bzw. Trennkette für Guss');
      normen.add('DIN EN 877');
      normen.add('DIN 1986-100');
    } else if (t.werkstoff === 'kupfer' || t.werkstoff === 'edelstahl' || t.werkstoff === 'cstahl') {
      material.add('Pressfittings des zugelassenen Systems (Bogen, T-Stück, Übergang)');
      werkzeug.add('Akku-Pressmaschine mit passender Pressbacke');
      werkzeug.add('Rohrabschneider und Innen-/Außenentgrater');
    } else if (t.werkstoff === 'ht' || t.werkstoff === 'kg') {
      material.add('Formteile (Bogen, Abzweig, Übergang) und Gleitmittel');
      werkzeug.add('Feinsäge bzw. Rohrschneider für Kunststoffrohr');
      normen.add('DIN EN 12056');
    } else if (t.werkstoff === 'verbundrohr') {
      material.add('Press- oder Schiebehülsenfittings');
      werkzeug.add('Rohrschere und Kalibrierwerkzeug');
    }
  }

  return {
    text,
    treffer,
    werkzeug: [...werkzeug],
    material: [...material],
    normen: [...normen],
    hinweise: [...hinweise],
  };
}

/**
 * Kompakter Hinweisblock für den KI-Prompt: nur die im Text erkannten Begriffe.
 * Hält den Prompt klein und die Fachsprache trotzdem verbindlich.
 */
function promptHinweise(eingabe) {
  const n = normalisiere(eingabe);
  if (!n.treffer.length) return '';
  const zeilen = [];
  const gesehen = new Set();
  for (const t of n.treffer) {
    const key = `${t.roh.toLowerCase()}=>${t.fach}`;
    if (gesehen.has(key)) continue;
    gesehen.add(key);
    zeilen.push(`- "${t.roh}" => ${t.fach}`);
  }
  return ['Verbindliche Begriffszuordnung aus dem Betriebsglossar (so verwenden):', ...zeilen.slice(0, 40)].join('\n');
}

/* ---------- server/ai/svg.js ---------- */
/**
 * SVG-Werkzeuge
 * ---------------------------------------------------------------------------
 * 1. saeubereSvg(): härtet von der KI geliefertes SVG-Markup ab
 *    (nur erlaubte Elemente/Attribute, keine Skripte, keine externen Verweise).
 * 2. schemaZeichnung(): erzeugt ohne KI eine einfache Prinzipskizze
 *    aus erkannten Bauteilen (Fachmodus offline).
 */

const ERLAUBTE_ELEMENTE = new Set([
  'svg', 'g', 'defs', 'title', 'desc',
  'line', 'polyline', 'polygon', 'rect', 'circle', 'ellipse', 'path',
  'text', 'tspan',
]);

const ERLAUBTE_ATTRIBUTE = new Set([
  'viewbox', 'xmlns', 'class', 'id', 'transform', 'opacity',
  'd', 'points', 'x', 'y', 'x1', 'y1', 'x2', 'y2', 'cx', 'cy', 'r', 'rx', 'ry',
  'width', 'height', 'dx', 'dy',
  'stroke', 'stroke-width', 'stroke-dasharray', 'stroke-linecap', 'stroke-linejoin', 'stroke-opacity',
  'fill', 'fill-opacity', 'fill-rule',
  'font-size', 'font-family', 'font-weight', 'font-style',
  'text-anchor', 'dominant-baseline', 'letter-spacing',
]);

const BOESE_WERTE = /(javascript:|data:text\/html|expression\(|url\s*\(|<\s*script)/i;

// SVG-Attribute mit vorgeschriebener Schreibweise (Rest ist klein geschrieben).
const SCHREIBWEISE = { viewbox: 'viewBox' };

function attributeLesen(roh) {
  const out = [];
  const re = /([a-zA-Z_:][-a-zA-Z0-9_:.]*)\s*=\s*("([^"]*)"|'([^']*)'|([^\s"'=<>`]+))/g;
  let m;
  while ((m = re.exec(roh))) {
    const name = m[1].toLowerCase();
    const wert = m[3] ?? m[4] ?? m[5] ?? '';
    out.push([name, wert]);
  }
  return out;
}

/**
 * Säubert SVG-Markup. Liefert null, wenn nichts Brauchbares übrig bleibt.
 */
function saeubereSvg(roh) {
  if (typeof roh !== 'string' || !roh.trim()) return null;
  let markup = roh.trim();

  // Codefences und XML-Deklaration entfernen
  markup = markup
    .replace(/^```(?:svg|xml|html)?/i, '')
    .replace(/```$/i, '')
    .replace(/<\?xml[^>]*\?>/gi, '')
    .replace(/<!DOCTYPE[^>]*>/gi, '')
    .replace(/<!--[\s\S]*?-->/g, '');

  const start = markup.search(/<svg[\s>]/i);
  if (start < 0) return null;
  const ende = markup.toLowerCase().lastIndexOf('</svg>');
  markup = ende > start ? markup.slice(start, ende + 6) : markup.slice(start);

  let ergebnis = '';
  let pos = 0;
  let wurzelGesehen = false;
  const tiefe = [];
  // Verbotene Elemente werden samt Inhalt verworfen (z. B. <script>).
  let ueberspringen = null;
  let ueberspringTiefe = 0;

  while (pos < markup.length) {
    const auf = markup.indexOf('<', pos);
    if (auf < 0) {
      if (!ueberspringen) ergebnis += markup.slice(pos).replace(/[<>]/g, '');
      break;
    }
    // Text vor dem Tag
    if (!ueberspringen) ergebnis += markup.slice(pos, auf).replace(/[<>]/g, '');

    const zu = markup.indexOf('>', auf);
    if (zu < 0) break;
    const inhalt = markup.slice(auf + 1, zu).trim();
    pos = zu + 1;

    if (!inhalt || inhalt.startsWith('!') || inhalt.startsWith('?')) continue;

    /* ----------------------------------------------- schließendes Tag */
    if (inhalt.startsWith('/')) {
      const name = inhalt.slice(1).trim().toLowerCase();
      if (ueberspringen) {
        if (name === ueberspringen) {
          ueberspringTiefe -= 1;
          if (ueberspringTiefe <= 0) ueberspringen = null;
        }
        continue;
      }
      if (ERLAUBTE_ELEMENTE.has(name) && tiefe[tiefe.length - 1] === name) {
        tiefe.pop();
        ergebnis += `</${name}>`;
      }
      continue;
    }

    /* ----------------------------------------------- öffnendes Tag */
    const selbstschliessend = inhalt.endsWith('/');
    const kern = selbstschliessend ? inhalt.slice(0, -1).trim() : inhalt;
    const name = (kern.match(/^[a-zA-Z_:][-a-zA-Z0-9_:.]*/) || [''])[0].toLowerCase();

    if (ueberspringen) {
      if (name === ueberspringen && !selbstschliessend) ueberspringTiefe += 1;
      continue;
    }

    if (!ERLAUBTE_ELEMENTE.has(name)) {
      if (!selbstschliessend && name) {
        ueberspringen = name;
        ueberspringTiefe = 1;
      }
      continue;
    }
    if (name === 'svg') {
      if (wurzelGesehen) continue;
      wurzelGesehen = true;
    }

    const attrRoh = kern.slice(name.length);
    const attribute = [];
    let hatViewBox = false;
    for (const [an, av] of attributeLesen(attrRoh)) {
      if (an.startsWith('on')) continue;
      if (an === 'style') continue;
      if (an === 'href' || an.endsWith(':href') || an === 'src') continue;
      if (!ERLAUBTE_ATTRIBUTE.has(an)) continue;
      if (BOESE_WERTE.test(av)) continue;
      if (name === 'svg' && (an === 'width' || an === 'height')) continue; // responsiv halten
      if (an === 'viewbox') hatViewBox = true;
      attribute.push(`${SCHREIBWEISE[an] || an}="${av.replace(/"/g, '&quot;')}"`);
    }

    if (name === 'svg') {
      if (!hatViewBox) attribute.push('viewBox="0 0 900 460"');
      attribute.push('xmlns="http://www.w3.org/2000/svg"');
      attribute.push('class="zeichnung-svg"');
    }

    const attrText = attribute.length ? ` ${attribute.join(' ')}` : '';
    if (selbstschliessend) {
      ergebnis += `<${name}${attrText} />`;
    } else {
      tiefe.push(name);
      ergebnis += `<${name}${attrText}>`;
    }
  }

  while (tiefe.length) ergebnis += `</${tiefe.pop()}>`;
  if (!wurzelGesehen) return null;
  if (!/<(line|rect|circle|path|polyline|polygon|ellipse|text)/i.test(ergebnis)) return null;
  return ergebnis;
}

/* -------------------------------------------------------------------------- */
/* Offline-Prinzipskizze                                                      */
/* -------------------------------------------------------------------------- */

/** Bauteilerkennung für die Offline-Skizze (Reihenfolge = Einbaureihenfolge). */
const BAUTEIL_MUSTER = [
  { re: /hausanschluss|hauptabsperr|hae\b|übergabestelle/i, name: 'Hausanschluss', symbol: 'ventil' },
  { re: /absperr|kugelhahn|kugelventil|hahn/i, name: 'Absperrventil', symbol: 'ventil' },
  { re: /filter|schmutzfänger|schlammfänger/i, name: 'Filter', symbol: 'filter' },
  { re: /wasserzähler|wasseruhr|zähler/i, name: 'Wasserzähler', symbol: 'zaehler' },
  { re: /rückflussverhinderer|rückschlag/i, name: 'Rückflussverhinderer', symbol: 'rv' },
  { re: /systemtrenner/i, name: 'Systemtrenner BA', symbol: 'kasten' },
  { re: /druckminderer|druckreduzier/i, name: 'Druckminderer', symbol: 'minderer' },
  { re: /enthärt|weichwasser/i, name: 'Enthärtungsanlage', symbol: 'kasten' },
  { re: /speicher|trinkwassererwärmer|boiler/i, name: 'Trinkwassererwärmer', symbol: 'speicher' },
  { re: /frischwasserstation/i, name: 'Frischwasserstation', symbol: 'kasten' },
  { re: /wärmepumpe/i, name: 'Wärmepumpe', symbol: 'kasten' },
  { re: /brennwert|kessel|therme/i, name: 'Wärmeerzeuger', symbol: 'kessel' },
  { re: /ausdehnungsgefäß|\bmag\b/i, name: 'Ausdehnungsgefäß', symbol: 'mag' },
  { re: /sicherheitsventil|\bsv\b/i, name: 'Sicherheitsventil', symbol: 'sv' },
  { re: /pumpe|umwälz|zirkulation/i, name: 'Pumpe', symbol: 'pumpe' },
  { re: /mischer|dreiwege/i, name: 'Mischer', symbol: 'ventil' },
  { re: /verteiler|heizkreis/i, name: 'Heizkreisverteiler', symbol: 'verteiler' },
  { re: /heizkörper|radiator/i, name: 'Heizkörper', symbol: 'heizkoerper' },
  { re: /fußbodenheizung|flächenheizung/i, name: 'Fußbodenheizung', symbol: 'fbh' },
  { re: /entnahmestelle|zapfstelle|armatur|waschtisch|dusche/i, name: 'Entnahmestelle', symbol: 'entnahme' },
  { re: /fallleitung|fall-leitung/i, name: 'Fallleitung', symbol: 'rohr' },
  { re: /sammelleitung|grundleitung/i, name: 'Sammelleitung', symbol: 'rohr' },
  { re: /hebeanlage/i, name: 'Hebeanlage', symbol: 'kasten' },
  { re: /geruchsverschluss|siphon/i, name: 'Geruchsverschluss', symbol: 'siphon' },
  { re: /kanal|öffentliche entwässerung/i, name: 'Kanalanschluss', symbol: 'rohr' },
];

function symbolZeichnen(art, x, y, b, h) {
  const mx = x + b / 2;
  const my = y + h / 2;
  switch (art) {
    case 'ventil':
      return `<polygon points="${x + 8},${y + 8} ${x + 8},${y + h - 8} ${mx},${my}" />
              <polygon points="${x + b - 8},${y + 8} ${x + b - 8},${y + h - 8} ${mx},${my}" />`;
    case 'rv':
      return `<polygon points="${x + 10},${y + 8} ${x + 10},${y + h - 8} ${x + b - 14},${my}" />
              <line x1="${x + b - 12}" y1="${y + 8}" x2="${x + b - 12}" y2="${y + h - 8}" />`;
    case 'filter':
      return `<rect x="${x + 10}" y="${y + 8}" width="${b - 20}" height="${h - 16}" />
              <line x1="${x + 10}" y1="${y + 8}" x2="${x + b - 10}" y2="${y + h - 8}" stroke-dasharray="3 3" />`;
    case 'zaehler':
      return `<circle cx="${mx}" cy="${my}" r="${Math.min(b, h) / 2 - 8}" />
              <line x1="${mx}" y1="${my}" x2="${mx + 8}" y2="${my - 8}" />`;
    case 'minderer':
      return `<rect x="${x + 10}" y="${y + 12}" width="${b - 20}" height="${h - 24}" />
              <line x1="${mx}" y1="${y + 12}" x2="${mx}" y2="${y - 2}" />
              <polyline points="${mx - 8},${y - 2} ${mx + 8},${y - 2} ${mx + 8},${y - 8} ${mx - 8},${y - 8} ${mx - 8},${y - 2}" />`;
    case 'pumpe':
      return `<circle cx="${mx}" cy="${my}" r="${Math.min(b, h) / 2 - 8}" />
              <polygon points="${mx - 6},${my - 8} ${mx - 6},${my + 8} ${mx + 9},${my}" />`;
    case 'speicher':
      return `<rect x="${x + 12}" y="${y + 6}" width="${b - 24}" height="${h - 12}" rx="8" />
              <path d="M ${x + 20} ${my + 10} q 10 -14 20 0 q 10 14 20 0" />`;
    case 'kessel':
      return `<rect x="${x + 10}" y="${y + 6}" width="${b - 20}" height="${h - 12}" rx="4" />
              <polyline points="${mx - 8},${my + 10} ${mx},${my - 4} ${mx + 8},${my + 10}" />`;
    case 'mag':
      return `<ellipse cx="${mx}" cy="${my}" rx="${b / 2 - 12}" ry="${h / 2 - 8}" />
              <line x1="${x + 12}" y1="${my}" x2="${x + b - 12}" y2="${my}" stroke-dasharray="4 3" />`;
    case 'sv':
      return `<polygon points="${x + 12},${my} ${mx},${y + 10} ${x + b - 12},${my}" />
              <line x1="${mx}" y1="${y + 10}" x2="${mx}" y2="${y - 6}" />`;
    case 'verteiler':
      return `<rect x="${x + 8}" y="${my - 8}" width="${b - 16}" height="16" />
              ${[0, 1, 2, 3]
                .map((i) => `<line x1="${x + 18 + i * 16}" y1="${my + 8}" x2="${x + 18 + i * 16}" y2="${y + h - 4}" />`)
                .join('')}`;
    case 'heizkoerper':
      return `<rect x="${x + 10}" y="${y + 8}" width="${b - 20}" height="${h - 16}" />
              ${[0, 1, 2, 3]
                .map((i) => `<line x1="${x + 18 + i * 14}" y1="${y + 8}" x2="${x + 18 + i * 14}" y2="${y + h - 8}" />`)
                .join('')}`;
    case 'fbh':
      return `<path d="M ${x + 10} ${y + h - 12} q 12 -26 24 0 q 12 26 24 0 q 12 -26 24 0" />`;
    case 'siphon':
      return `<path d="M ${mx - 12} ${y + 8} v ${h / 2} q 0 14 12 14 q 12 0 12 -14 v -${h / 2 - 6}" />`;
    case 'entnahme':
      return `<polyline points="${x + 12},${y + h - 10} ${x + 12},${y + 14} ${x + b - 14},${y + 14}" />
              <line x1="${x + b - 14}" y1="${y + 14}" x2="${x + b - 14}" y2="${y + 26}" />`;
    case 'rohr':
      return `<line x1="${x + 10}" y1="${my}" x2="${x + b - 10}" y2="${my}" stroke-width="4" />`;
    default:
      return `<rect x="${x + 10}" y="${y + 8}" width="${b - 20}" height="${h - 16}" rx="4" />`;
  }
}

function pfeil(x, y) {
  return `<polygon points="${x},${y - 5} ${x},${y + 5} ${x + 9},${y}" fill="currentColor" />`;
}

/**
 * Erzeugt eine einfache Prinzipskizze aus einer Beschreibung.
 * @param {string} beschreibung
 * @param {string} [titel]
 */
function schemaZeichnung(beschreibung, titel) {
  const text = String(beschreibung || '');
  const bauteile = [];
  for (const m of BAUTEIL_MUSTER) {
    if (m.re.test(text) && !bauteile.some((b) => b.name === m.name)) bauteile.push(m);
  }
  if (bauteile.length < 2) {
    // Standard: Hauswasserstation als häufigster Fall
    bauteile.length = 0;
    bauteile.push(
      BAUTEIL_MUSTER.find((m) => m.name === 'Hausanschluss'),
      BAUTEIL_MUSTER.find((m) => m.name === 'Absperrventil'),
      BAUTEIL_MUSTER.find((m) => m.name === 'Filter'),
      BAUTEIL_MUSTER.find((m) => m.name === 'Wasserzähler'),
      BAUTEIL_MUSTER.find((m) => m.name === 'Rückflussverhinderer'),
      BAUTEIL_MUSTER.find((m) => m.name === 'Druckminderer'),
      BAUTEIL_MUSTER.find((m) => m.name === 'Entnahmestelle'),
    );
  }

  const proZeile = 4;
  const bB = 150;
  const bH = 90;
  const abstand = 60;
  const zeilen = Math.ceil(bauteile.length / proZeile);
  const breite = proZeile * bB + (proZeile - 1) * abstand + 80;
  const hoehe = 60 + zeilen * (bH + 78);

  let teile = '';
  bauteile.forEach((bt, i) => {
    const zeile = Math.floor(i / proZeile);
    const spalte = i % proZeile;
    const x = 40 + spalte * (bB + abstand);
    const y = 70 + zeile * (bH + 80);
    teile += `<g>${symbolZeichnen(bt.symbol, x, y, bB, bH)}
      <rect x="${x}" y="${y}" width="${bB}" height="${bH}" rx="6" stroke-dasharray="2 4" opacity="0.35" />
      <text x="${x + bB / 2}" y="${y + bH + 22}" text-anchor="middle" font-size="13" stroke="none" fill="currentColor">${escapeText(bt.name)}</text></g>`;

    const letzterDerZeile = spalte === proZeile - 1 || i === bauteile.length - 1;
    if (!letzterDerZeile) {
      const my = y + bH / 2;
      teile += `<line x1="${x + bB}" y1="${my}" x2="${x + bB + abstand}" y2="${my}" stroke-width="3" />`;
      teile += pfeil(x + bB + abstand / 2 - 4, my);
    } else if (i !== bauteile.length - 1) {
      // Zeilenumbruch: rechts heraus, unterhalb der Zeile zurueck, dann von links herein
      const my = y + bH / 2;
      const zwischen = y + bH + 44;
      const nyMitte = y + bH + 80 + bH / 2;
      teile +=
        `<polyline points="${x + bB},${my} ${x + bB + 25},${my} ${x + bB + 25},${zwischen} ` +
        `20,${zwischen} 20,${nyMitte} 40,${nyMitte}" stroke-width="3" />`;
      teile += pfeil(26, nyMitte);
    }
  });

  const kopf = escapeText(titel || 'Prinzipskizze');
  const svg = `<svg viewBox="0 0 ${breite} ${hoehe}" xmlns="http://www.w3.org/2000/svg" class="zeichnung-svg">
  <g stroke="currentColor" fill="none" stroke-width="2" font-family="system-ui, sans-serif">
    <text x="40" y="34" font-size="17" font-weight="600" stroke="none" fill="currentColor">${kopf}</text>
    ${teile}
  </g>
</svg>`;

  return {
    titel: titel || 'Prinzipskizze',
    svg,
    beschreibung:
      'Prinzipskizze in Fließrichtung: Die Bauteile sind in ihrer Einbaureihenfolge dargestellt. ' +
      'Die Skizze wurde ohne KI aus den erkannten Bauteilen erzeugt und kann nachbearbeitet werden.',
    legende: bauteile.map((b) => ({ zeichen: b.name, bedeutung: 'Bauteil in Einbaureihenfolge' })),
  };
}

function escapeText(t) {
  return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/**
 * Fachmodus offline
 * ---------------------------------------------------------------------------
 * Erzeugt Berichtshefteinträge, Fachberichte, Erklärungen und Vertiefungen
 * ohne KI-Schlüssel – allein aus der Fachsprache-Engine und der Wissensbasis.
 * Die App bleibt damit auch ohne Serverschlüssel voll bedienbar.
 */



const WOCHENTAGE = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];

const AKTION_ZU_NOMEN = [
  [/montiert|befestigt|verlegt|installiert/i, 'Montage'],
  [/demontiert|ausgebaut|entsorgt/i, 'Demontage'],
  [/dichtheits|druckprobe|belastungsprüfung/i, 'Dichtheitsprüfung'],
  [/gespült/i, 'Spülung'],
  [/gedämmt/i, 'Dämmarbeiten'],
  [/in betrieb/i, 'Inbetriebnahme'],
  [/abgeglichen|eingeregelt/i, 'Hydraulischer Abgleich'],
  [/gebohrt|gestemmt|durchbruch/i, 'Vorbereitende Arbeiten'],
  [/gewartet|instand/i, 'Instandhaltung'],
  [/berufsschul/i, 'Berufsschule'],
  [/unterweisung/i, 'Unterweisung'],
];

/** Text in einzelne Tätigkeitspunkte zerlegen. */
function inPunkte(text) {
  return String(text)
    .split(/(?:,\s*(?:danach|dann|anschließend|außerdem|zusätzlich)\s*|\s+und\s+(?:danach|dann|anschließend)\s+|[.;]\s+|\s*\n+\s*)/i)
    .map((s) => s.replace(/^(?:und|danach|dann|anschließend|außerdem)\s+/i, '').trim())
    .filter((s) => s.length > 2)
    .map((s) => s.charAt(0).toUpperCase() + s.slice(1))
    .map((s) => (/[.!?]$/.test(s) ? s : `${s}.`));
}

function titelAus(normalisiert) {
  const aktion = AKTION_ZU_NOMEN.find(([re]) => re.test(normalisiert.text));
  const objekt =
    normalisiert.treffer.find((t) => t.kategorie === 'rohr')?.fach ||
    normalisiert.treffer.find((t) => t.kategorie === 'bauteil')?.fach ||
    '';
  const objektKurz = objekt.replace(/\s*\([^)]*\)\s*/g, '').trim();
  if (aktion && objektKurz) return `${aktion[1]} von ${objektKurz}`;
  if (aktion) return aktion[1];
  if (objektKurz) return `Arbeiten an ${objektKurz}`;
  return 'Tätigkeitsbericht';
}

/** Diktat an Wochentagen aufteilen. */
function tageTrennen(text) {
  const muster = new RegExp(`\\b(${WOCHENTAGE.join('|')})\\b`, 'gi');
  const treffer = [...String(text).matchAll(muster)];
  if (!treffer.length) return [{ tag: 'Ohne Zuordnung', text: String(text).trim() }];

  const bloecke = [];
  if (treffer[0].index > 0) {
    const vorlauf = text.slice(0, treffer[0].index).trim();
    if (vorlauf.length > 3) bloecke.push({ tag: 'Ohne Zuordnung', text: vorlauf });
  }
  treffer.forEach((t, i) => {
    const start = t.index + t[0].length;
    const ende = i + 1 < treffer.length ? treffer[i + 1].index : text.length;
    const tag = t[0].charAt(0).toUpperCase() + t[0].slice(1).toLowerCase();
    const inhalt = text
      .slice(start, ende)
      .replace(/^(?:\s*(?:hab(?:e)?\s+ich|war\s+ich|habe|ich|:|,|-)\s*)+/i, '')
      .trim();
    if (inhalt.length > 2) bloecke.push({ tag, text: inhalt });
  });
  return bloecke.length ? bloecke : [{ tag: 'Ohne Zuordnung', text: String(text).trim() }];
}

function offlineBerichtsheft(transkript) {
  const tage = tageTrennen(transkript).map(({ tag, text }) => {
    const n = normalisiere(text);
    return {
      tag,
      eintraege: [
        {
          titel: titelAus(n),
          punkte: inPunkte(n.text),
          material: n.material,
          werkzeug: n.werkzeug,
          normen: n.normen,
        },
      ],
    };
  });
  const hinweise = [...new Set(tageTrennen(transkript).flatMap((b) => normalisiere(b.text).hinweise))];
  return { tage, hinweise, quelle: 'offline' };
}

function offlineFachbericht(transkript) {
  const n = normalisiere(transkript);
  const punkte = inPunkte(n.text);
  const arbeitsschritte = punkte.map((p, i) => ({
    titel: `Arbeitsschritt ${i + 1}`,
    beschreibung: p,
    hinweis: '',
  }));

  const erklaerungen = [];
  const gesehen = new Set();
  for (const t of n.treffer) {
    const w = findeWissen(t.fach) || findeWissen(t.roh);
    if (w && !gesehen.has(w.begriff)) {
      gesehen.add(w.begriff);
      const zusatz = w.werte?.length ? `\n\nKennwerte: ${w.werte.slice(0, 3).join(' · ')}` : '';
      erklaerungen.push({ begriff: w.begriff, text: `${w.kurz}\n\n${w.funktion}${zusatz}` });
    }
    if (erklaerungen.length >= 5) break;
  }

  return {
    titel: titelAus(n),
    einleitung:
      'Der Fachbericht dokumentiert die ausgeführten Arbeiten, das eingesetzte Material und Werkzeug ' +
      'sowie die zugrunde liegenden technischen Regeln. Grundlage ist die Arbeitsschilderung: ' +
      `„${String(transkript).trim().slice(0, 300)}“`,
    anlage: '',
    arbeitsschritte,
    material: n.material.map((m) => ({ bezeichnung: m, dimension: '', menge: '', hinweis: '' })),
    werkzeug: [...new Set([...n.werkzeug, ...GRUNDWERKZEUG])].map((w) => ({ bezeichnung: w, zweck: '' })),
    arbeitssicherheit: [
      'Persönliche Schutzausrüstung tragen (Schutzbrille, Handschuhe, Sicherheitsschuhe, bei Trennarbeiten Gehörschutz).',
      'Vor Arbeitsbeginn Anlagenteil absperren, entleeren und gegen Wiedereinschalten sichern.',
      ...n.hinweise,
    ],
    normen: n.normen.map((x) => ({ bezeichnung: x, inhalt: '' })),
    erklaerungen,
    fazit: '',
    quelle: 'offline',
  };
}

/** Baut aus einem Datenbankeintrag die Abschnitte einer Erklärung. */
function abschnitteAus(eintrag) {
  const abschnitte = [{ titel: 'Funktionsprinzip', text: eintrag.funktion, punkte: [] }];
  if (eintrag.aufbau?.length) abschnitte.push({ titel: 'Aufbau', text: '', punkte: eintrag.aufbau });
  if (eintrag.einsatz?.length) abschnitte.push({ titel: 'Einsatz und Einbau', text: '', punkte: eintrag.einsatz });
  if (eintrag.werte?.length) abschnitte.push({ titel: 'Kennwerte und Richtwerte', text: '', punkte: eintrag.werte });
  if (eintrag.formeln?.length) {
    abschnitte.push({
      titel: 'Berechnung',
      text: '',
      punkte: eintrag.formeln.map((f) => `${f.name}: ${f.formel} – ${f.erklaerung}`),
    });
  }
  if (eintrag.hinweise?.length) abschnitte.push({ titel: 'Praxishinweise', text: '', punkte: eintrag.hinweise });
  if (eintrag.stoerungen?.length) abschnitte.push({ titel: 'Typische Fehlerbilder', text: '', punkte: eintrag.stoerungen });
  return abschnitte;
}

function offlineErklaerung(begriff) {
  const eintrag = findeWissen(begriff);
  if (!eintrag) {
    const n = normalisiere(begriff);
    const fach = n.treffer[0]?.fach;
    const aehnlich = sucheWissen(begriff, { grenze: 5 }).map((t) => t.eintrag.begriff);
    return {
      begriff: fach || String(begriff).trim(),
      kurz: fach
        ? `„${String(begriff).trim()}“ heißt in der Fachsprache ${fach}.`
        : `Zu „${String(begriff).trim()}“ gibt es in der Fachdatenbank noch keinen eigenen Eintrag.`,
      abschnitte: [
        {
          titel: 'Hinweis',
          text:
            'Die Fachdatenbank deckt die wichtigsten Themen der Anlagenmechanik SHK und der Versorgungstechnik ab. ' +
            'Sobald auf dem Server ein KI-Zugang hinterlegt ist, beantwortet die KI zusätzlich jede freie Frage.',
          punkte: [],
        },
      ],
      normen: n.normen,
      stichworte: aehnlich,
      quelle: 'offline',
    };
  }

  return {
    begriff: eintrag.begriff,
    kurz: eintrag.kurz,
    abschnitte: abschnitteAus(eintrag),
    normen: eintrag.normen || [],
    stichworte: (eintrag.verwandt || [])
      .map((id) => findeWissen(id)?.begriff)
      .filter(Boolean),
    quelle: 'offline',
  };
}

function offlineVertiefung(begriff, frage) {
  const suchtext = `${begriff || ''} ${frage || ''}`.trim();
  const eintrag = findeWissen(frage) || findeWissen(begriff) || findeWissen(suchtext);
  const f = schluessel(frage || '');

  // Hinterlegte Antworten auf typische Rückfragen bevorzugen
  const kandidaten = [eintrag, ...sucheWissen(suchtext, { grenze: 3 }).map((t) => t.eintrag)].filter(Boolean);
  for (const k of kandidaten) {
    for (const v of k.vertiefungen || []) {
      const woerterFrage = f.split(' ').filter((w) => w.length > 3);
      const vs = schluessel(v.frage);
      const treffer = woerterFrage.filter((w) => vs.includes(w)).length;
      if (treffer >= 2 || (f && vs.includes(f))) {
        return { titel: v.frage, text: v.text, punkte: [], quelle: 'offline' };
      }
    }
  }

  if (eintrag) {
    return {
      titel: `${eintrag.begriff} – ausführlich`,
      text: `${eintrag.kurz}\n\n${eintrag.funktion}`,
      punkte: [...(eintrag.werte || []), ...(eintrag.hinweise || []), ...(eintrag.stoerungen || [])],
      quelle: 'offline',
    };
  }

  return {
    titel: 'Vertiefung nicht möglich',
    text:
      'Zu dieser Rückfrage gibt es in der Fachdatenbank keinen passenden Eintrag. ' +
      'Mit hinterlegtem KI-Zugang beantwortet die KI auch freie Fragen.',
    punkte: [],
    quelle: 'offline',
  };
}

function offlineZeichnung(beschreibung, titel) {
  return { ...schemaZeichnung(beschreibung, titel), quelle: 'offline' };
}

const ZAHLWORTE = {
  eins: 1, ein: 1, eine: 1, erste: 1, ersten: 1,
  zwei: 2, zweite: 2, zweiten: 2,
  drei: 3, dritte: 3, dritten: 3,
  vier: 4, vierte: 4, vierten: 4,
  fünf: 5, fünfte: 5, fünften: 5,
  sechs: 6, sechste: 6, sechsten: 6,
  sieben: 7, siebte: 7, siebten: 7,
  acht: 8, achte: 8, achten: 8,
  neun: 9, neunte: 9, neunten: 9,
  zehn: 10, zehnte: 10, zehnten: 10,
};

function nummerAus(text) {
  const ziffer = text.match(/\b(\d{1,2})\b/);
  if (ziffer) return Number(ziffer[1]);
  for (const [wort, zahl] of Object.entries(ZAHLWORTE)) {
    if (new RegExp(`\\b${wort}\\b`, 'i').test(text)) return zahl;
  }
  return undefined;
}

/**
 * Erkennt Sprachbefehle lokal (schnell und kostenfrei).
 * Liefert null, wenn es kein Befehl, sondern normaler Diktattext ist.
 */
function erkenneBefehl(eingabe) {
  const text = String(eingabe || '').trim();
  if (!text) return null;
  const t = text.toLowerCase();

  if (/^(?:bitte\s+)?(?:lösch|loesch|entfern|streich|nimm|weg mit)/.test(t) || /raus(?:nehmen|werfen)/.test(t)) {
    const nummer = nummerAus(t);
    const suchtext = text
      .replace(/^(?:bitte\s+)?(?:lösch(?:e|en)?|loesch(?:e|en)?|entfern(?:e|en)?|streich(?:e|en)?|nimm|weg mit)\s*/i, '')
      .replace(/\b(?:punkt|nummer|eintrag|zeile|schritt|position)\b\s*\d*/i, '')
      .replace(/\braus\b|\bweg\b/i, '')
      .trim();
    return { aktion: 'loeschen', nummer, suchtext, quelle: 'lokal' };
  }

  if (/^(?:bitte\s+)?(?:erklär|erklaer|erkläre|was ist|was bedeutet|wofür ist|wozu dient|erläuter)/.test(t)) {
    const begriff = text
      .replace(/^(?:bitte\s+)?(?:erkläre?|erklaere?|erläutere?|was ist|was bedeutet|wofür ist|wozu dient)\s*/i, '')
      .replace(/^(?:mir|uns)\s+/i, '')
      .replace(/^(?:ein|eine|einen|einem|der|die|das|den|dem)\s+/i, '')
      .replace(/[?!.]+$/, '')
      .trim();
    return { aktion: 'erklaeren', begriff, quelle: 'lokal' };
  }

  if (/(ausführlicher|ausfuehrlicher|genauer|mehr details|mehr detail|noch mehr|vertiefe|tiefer|weiter erklären)/.test(t)) {
    return { aktion: 'vertiefen', begriff: text, quelle: 'lokal' };
  }

  if (/(zeichnung|skizze|zeichne|schema|strangschema|funktionsschema)/.test(t)) {
    return { aktion: 'zeichnung', begriff: text, quelle: 'lokal' };
  }

  if (/^(?:bitte\s+)?(?:speicher|sichere|sicher ab)/.test(t)) {
    return { aktion: 'speichern', quelle: 'lokal' };
  }

  if (/^(?:der\s+)?titel\s*(?:ist|lautet|:)?\s*/.test(t)) {
    return {
      aktion: 'titel',
      text: text.replace(/^(?:der\s+)?titel\s*(?:ist|lautet|:)?\s*/i, '').trim(),
      quelle: 'lokal',
    };
  }

  return null;
}

    var $ = function (sel) { return document.querySelector(sel); };

    function el(beschreibung, attribute, kinder) {
      var teile = String(beschreibung).split('.');
      var knoten = document.createElement(teile.shift() || 'div');
      if (teile.length) knoten.className = teile.join(' ');
      attribute = attribute || {};
      Object.keys(attribute).forEach(function (name) {
        var wert = attribute[name];
        if (wert === undefined || wert === null || wert === false) return;
        if (name === 'text') knoten.textContent = String(wert);
        else if (name === 'html') knoten.innerHTML = wert;
        else if (name === 'wert') knoten.value = wert;
        else if (name.indexOf('on') === 0 && typeof wert === 'function') knoten.addEventListener(name.slice(2), wert);
        else knoten.setAttribute(name, wert === true ? '' : String(wert));
      });
      [].concat(kinder || []).forEach(function (kind) {
        if (kind === null || kind === undefined || kind === false) return;
        knoten.appendChild(kind instanceof Node ? kind : document.createTextNode(String(kind)));
      });
      return knoten;
    }

    function leere(knoten) {
      while (knoten.firstChild) knoten.removeChild(knoten.firstChild);
      return knoten;
    }

    function meldung(text, art, dauer) {

    function anthropicAnfrage(prompt, maxTokens, temperatur) {
      var einst = Einstellungen.lesen();
      if (!einst.apiKey) return Promise.reject({ code: 'kein_schluessel', message: 'Kein API-Schlüssel hinterlegt.' });

      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, 90000);

      return fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': einst.apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: einst.modell || 'claude-sonnet-5',
          max_tokens: maxTokens || 4000,
          temperature: temperatur === undefined ? 0.3 : temperatur,
          messages: [{ role: 'user', content: String(prompt) }],
        }),
        signal: controller.signal,
      }).then(
        function (res) {
          clearTimeout(timer);
          if (res.ok) return res.json();
          return res.text().catch(function () { return ''; }).then(function () {
            var fehler = { code: 'fehler', message: 'Die KI konnte die Anfrage nicht verarbeiten.' };
            if (res.status === 401 || res.status === 403) {
              fehler.code = 'ungueltig';
              fehler.message = 'Der API-Schlüssel ist ungültig, falsch oder abgelaufen.';
            } else if (res.status === 429) {
              fehler.code = 'rate_limited';
              fehler.message = 'Nutzungslimit erreicht oder zu viele Anfragen in kurzer Zeit.';
            } else if (res.status >= 500) {
              fehler.code = 'server';
              fehler.message = 'Die KI ist gerade überlastet.';
            }
            return Promise.reject(fehler);
          });
        },
        function (err) {
          clearTimeout(timer);
          if (err && err.name === 'AbortError') {
            return Promise.reject({ code: 'abgebrochen', message: 'Die KI hat zu lange gebraucht.' });
          }
          return Promise.reject({
            code: 'netzwerk',
            message: 'Keine Verbindung zur KI möglich. Internetverbindung und API-Schlüssel prüfen.',
          });
        }
      ).then(function (daten) {
        var text = (daten.content || [])
          .filter(function (b) { return b.type === 'text'; })
          .map(function (b) { return b.text; })
          .join('\n');
        if (!text.trim()) return Promise.reject({ code: 'leer', message: 'Die KI hat keinen Text geliefert.' });
        return text;
      });
    }

    /** Liest JSON tolerant aus einer KI-Antwort (Codefence oder erste/letzte Klammer). */
    function extrahiereJson(text) {
      try { return JSON.parse(text); } catch (e) { /* weiter unten versuchen */ }
      var zaun = text.match(/```(?:json)?\s*([\s\S]*?)```/i);
      if (zaun) {
        try { return JSON.parse(zaun[1]); } catch (e) { /* weiter unten versuchen */ }
      }
      var start = -1;
      var ende = -1;
      for (var i = 0; i < text.length; i += 1) {
        if (text[i] === '{' || text[i] === '[') { start = i; break; }
      }
      for (var j = text.length - 1; j >= 0; j -= 1) {
        if (text[j] === '}' || text[j] === ']') { ende = j; break; }
      }
      if (start >= 0 && ende > start) {
        try { return JSON.parse(text.slice(start, ende + 1)); } catch (e) { /* fällt durch */ }
      }
      throw new Error('Die Antwort der KI konnte nicht gelesen werden.');
    }

    /** Dialog zum Einrichten des eigenen API-Schlüssels. */
    function zeigeEinstellungen() {

        ]),
