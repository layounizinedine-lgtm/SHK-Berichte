    /* ---------------------------------------------------------- Speicher */
    var LOKAL = 'shk-berichte-v1';

    var Speicher = {
      lokalLesen: function () {
        try { return JSON.parse(localStorage.getItem(LOKAL) || '[]'); } catch (e) { return []; }
      },
      lokalSchreiben: function (liste) {
        localStorage.setItem(LOKAL, JSON.stringify(liste)); // wirft bei vollem Speicher, siehe speichern()
      },

      liste: function () {
        return Promise.resolve(Speicher.lokalLesen().map(kurzfassung).sort(nachDatum));
      },

      lesen: function (id) {
        var treffer = Speicher.lokalLesen().filter(function (b) { return b.id === id; })[0];
        return Promise.resolve(treffer || null);
      },

      speichern: function (bericht) {
        var satz = {
          typ: bericht.typ,
          titel: bericht.titel || 'Ohne Titel',
          daten: bericht.daten || {},
          erstellt: bericht.erstellt || new Date().toISOString(),
          geaendert: new Date().toISOString(),
        };
        var liste = Speicher.lokalLesen();
        var id = bericht.id || neueId();
        var index = -1;
        liste.forEach(function (b, i) { if (b.id === id) index = i; });
        var eintrag = Object.assign({ id: id }, satz);
        if (index >= 0) liste[index] = eintrag; else liste.push(eintrag);
        try {
          Speicher.lokalSchreiben(liste);
        } catch (e) {
          return Promise.reject(new Error(
            'Speichern fehlgeschlagen – der Browser-Speicher dieser Seite ist voll. ' +
            'Alte Berichte exportieren und löschen schafft wieder Platz.'
          ));
        }
        return Promise.resolve(id);
      },

      loeschen: function (id) {
        Speicher.lokalSchreiben(Speicher.lokalLesen().filter(function (b) { return b.id !== id; }));
        return Promise.resolve();
      },
    };

    function kurzfassung(b) {
      return { id: b.id, typ: b.typ, titel: b.titel, erstellt: b.erstellt, geaendert: b.geaendert };
    }
    function nachDatum(a, b) { return String(b.geaendert || '').localeCompare(String(a.geaendert || '')); }

    function datumText(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    /* ---------------------------------------------------------- KI */
    var REGELN = typeof FACHSPRACHE_REGELN === 'string' ? FACHSPRACHE_REGELN : '';

    function bauePrompt(teile) {
      return teile.filter(Boolean).join('\n').slice(0, 60000);
    }

    function kiFehlerText(code) {
      switch (code) {
        case 'kein_schluessel': return 'Kein API-Schlüssel hinterlegt – es wurde der Fachmodus verwendet. Schlüssel oben rechts unter dem Zahnrad eintragen.';
        case 'ungueltig': return 'Der API-Schlüssel ist ungültig oder abgelaufen – es wurde der Fachmodus verwendet.';
        case 'rate_limited': return 'Nutzungslimit erreicht oder zu viele Anfragen – es wurde der Fachmodus verwendet.';
        case 'netzwerk': return 'Keine Verbindung zur KI möglich – es wurde der Fachmodus verwendet.';
        case 'abgebrochen': return 'Die KI hat zu lange gebraucht – bitte kürzer diktieren. Es wurde der Fachmodus verwendet.';
        case 'cancelled': return 'Abgebrochen.';
        default: return 'Die KI war nicht erreichbar – es wurde der Fachmodus verwendet.';
      }
    }

    var KI = {
      da: function () { return Boolean(Einstellungen.lesen().apiKey); },

      json: function (prompt, optionen) {
        optionen = optionen || {};
        return anthropicAnfrage(prompt, optionen.maxTokens || 4000, optionen.temperatur).then(extrahiereJson);
      },

      berichtsheft: function (transkript) {
        if (!KI.da()) return Promise.resolve(offlineErgebnis(offlineBerichtsheft(transkript)));
        var prompt = bauePrompt([
          REGELN,
          '',
          'Aufgabe: Wandle das folgende Diktat in Berichtshefteinträge für den Ausbildungsnachweis um.',
          'Ordne die Tätigkeiten den genannten Wochentagen zu; ohne Wochentag nutze "Ohne Zuordnung".',
          'Formuliere im Nominalstil, ergänze fachlich notwendige Zwischenschritte, erfinde keine Mengen oder Zeiten.',
          '',
          'Diktat:\n"""' + transkript + '"""',
          promptHinweise(transkript),
          faktenBlock(transkript, 2),
          '',
          'Antworte ausschließlich mit JSON in genau dieser Form:',
          '{"tage":[{"tag":"Montag","eintraege":[{"titel":"Montage von …","punkte":["…","…"],"material":["…"],"werkzeug":["…"],"normen":["…"]}]}],"hinweise":["…"]}',
        ]);
        return KI.json(prompt, { cache: false })
          .then(function (e) { e.quelle = 'ki'; return e; })
          .catch(function (f) { return offlineErgebnis(offlineBerichtsheft(transkript), f); });
      },

      fachbericht: function (transkript) {
        if (!KI.da()) return Promise.resolve(offlineErgebnis(offlineFachbericht(transkript)));
        var prompt = bauePrompt([
          REGELN,
          '',
          'Aufgabe: Erstelle aus der Arbeitsschilderung einen vollständigen Fachbericht.',
          '- Arbeitsschritte in technisch richtiger Reihenfolge, jeder mit kurzer Begründung.',
          '- Materialliste mit Werkstoff, Dimension (DN bzw. Außendurchmesser x Wandstärke) und Verbindungstechnik.',
          '- Werkzeugliste mit Zweck.',
          '- Arbeitssicherheit konkret zur Tätigkeit.',
          '- 3 bis 6 Fachbegriffe lehrbuchartig erklären (Aufbau, Funktion, Zweck, Folgen bei Fehlern).',
          '- Mengen nur, wenn sie genannt wurden.',
          '',
          'Schilderung:\n"""' + transkript + '"""',
          promptHinweise(transkript),
          faktenBlock(transkript, 4),
          '',
          'Antworte ausschließlich mit JSON in genau dieser Form:',
          '{"titel":"…","einleitung":"…","anlage":"…","arbeitsschritte":[{"titel":"…","beschreibung":"…","hinweis":"…"}],' +
            '"material":[{"bezeichnung":"…","dimension":"…","menge":"","hinweis":"…"}],"werkzeug":[{"bezeichnung":"…","zweck":"…"}],' +
            '"arbeitssicherheit":["…"],"normen":[{"bezeichnung":"…","inhalt":"…"}],"erklaerungen":[{"begriff":"…","text":"…"}],"fazit":"…"}',
        ]);
        return KI.json(prompt, { cache: false })
          .then(function (e) { e.quelle = 'ki'; return e; })
          .catch(function (f) { return offlineErgebnis(offlineFachbericht(transkript), f); });
      },

      erklaerung: function (begriff, tiefe) {
        tiefe = tiefe || 1;
        if (!KI.da()) return Promise.resolve(offlineErgebnis(offlineErklaerung(begriff)));
        var umfang = tiefe >= 3
          ? 'Sehr ausführlich, auf Niveau der Gesellenprüfung Teil 2, mit Zahlenwerten, Berechnungsgrundlagen und Grenzwerten.'
          : tiefe === 2
            ? 'Ausführlich, mit typischen Einstellwerten und Fehlerbildern.'
            : 'Klar und verständlich, aber vollständig: Aufbau, Funktionsprinzip, Zweck, Einsatzort.';
        var prompt = bauePrompt([
          REGELN,
          '',
          'Aufgabe: Erkläre für einen Auszubildenden Anlagenmechaniker SHK: "' + begriff + '"',
          'Umfang: ' + umfang,
          'Gliedere in Abschnitte wie Aufbau, Funktionsprinzip, Einsatz und Einbau, Kennwerte, typische Fehlerbilder.',
          promptHinweise(begriff),
          faktenBlock(begriff, 2),
          '',
          'Antworte ausschließlich mit JSON in genau dieser Form:',
          '{"begriff":"…","kurz":"…","abschnitte":[{"titel":"…","text":"…","punkte":["…"]}],"normen":["…"],"stichworte":["…"]}',
        ]);
        return KI.json(prompt)
          .then(function (e) { e.quelle = 'ki'; e.tiefe = tiefe; return e; })
          .catch(function (f) { var r = offlineErgebnis(offlineErklaerung(begriff), f); r.tiefe = 1; return r; });
      },

      vertiefung: function (o) {
        if (!KI.da()) return Promise.resolve(offlineErgebnis(offlineVertiefung(o.begriff, o.frage)));
        var prompt = bauePrompt([
          REGELN,
          '',
          o.frage
            ? 'Aufgabe: Beantworte diese Rückfrage ausführlich und fachlich genau: "' + o.frage + '"'
            : 'Aufgabe: Erläutere diesen Punkt deutlich ausführlicher: "' + o.begriff + '"',
          o.begriff && o.frage ? 'Bezugspunkt: "' + o.begriff + '"' : '',
          o.bisher ? 'Bisher wurde dazu gesagt:\n"""' + String(o.bisher).slice(0, 4000) + '"""' : '',
          'Wiederhole das Bisherige nicht, sondern gehe tiefer: Ursachen, physikalische Zusammenhänge, Zahlenwerte, Folgen, Gegenmaßnahmen, Regelwerke.',
          promptHinweise((o.begriff || '') + ' ' + (o.frage || '')),
          faktenBlock((o.begriff || '') + ' ' + (o.frage || ''), 2),
          '',
          'Antworte ausschließlich mit JSON in genau dieser Form:',
          '{"titel":"…","text":"…","punkte":["…"]}',
        ]);
        return KI.json(prompt, { cache: false })
          .then(function (e) { e.quelle = 'ki'; return e; })
          .catch(function (f) { return offlineErgebnis(offlineVertiefung(o.begriff, o.frage), f); });
      },

      zeichnung: function (beschreibung, titel) {
        if (!KI.da()) return Promise.resolve(offlineErgebnis(zeichnungMitQuelle(schemaZeichnung(beschreibung, titel))));
        var prompt = bauePrompt([
          REGELN,
          '',
          'Aufgabe: Erstelle eine technische Prinzipskizze (Strang- bzw. Funktionsschema) als SVG zu: "' + beschreibung + '"',
          'Vorgaben für das SVG:',
          '- Wurzelelement <svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg"> ohne width/height.',
          '- Nur g, line, polyline, polygon, rect, circle, ellipse, path, text. Keine Skripte, kein style-Attribut, keine externen Verweise.',
          '- Linien: stroke="currentColor" fill="none" stroke-width="2". Text: fill="currentColor" stroke="none" font-size="13".',
          '- Fließrichtung mit kleinen Pfeil-Polygonen, jedes Bauteil beschriften, Aufbau von links nach rechts.',
          '- Fachlich korrekte Einbaureihenfolge und Fließrichtung.',
          promptHinweise(beschreibung),
          faktenBlock(beschreibung, 2),
          '',
          'Antworte ausschließlich mit JSON in genau dieser Form:',
          '{"titel":"…","beschreibung":"…","svg":"<svg …>…</svg>","legende":[{"zeichen":"…","bedeutung":"…"}]}',
        ]);
        return KI.json(prompt, { cache: false })
          .then(function (e) {
            var sauber = saeubereSvg(e.svg);
            if (!sauber) {
              var ersatz = zeichnungMitQuelle(schemaZeichnung(beschreibung, e.titel || titel));
              ersatz.warnung = 'Die KI-Skizze war nicht verwertbar – es wurde eine Prinzipskizze aus der Bauteilerkennung erzeugt.';
              return ersatz;
            }
            e.svg = sauber;
            e.quelle = 'ki';
            return e;
          })
          .catch(function (f) { return offlineErgebnis(zeichnungMitQuelle(schemaZeichnung(beschreibung, titel)), f); });
      },
    };

    function zeichnungMitQuelle(z) { z.quelle = 'offline'; return z; }

    function offlineErgebnis(ergebnis, fehler) {
      ergebnis.quelle = 'offline';
      if (fehler && fehler.code !== 'cancelled') ergebnis.warnung = kiFehlerText(fehler.code);
      else if (!KI.da()) ergebnis.warnung = 'Fachmodus: Text aus der eingebauten Fachsprache-Engine und Fachdatenbank.';
      return ergebnis;
    }

    /* ---------------------------------------------------------- Diktat */
    var Erkenner = window.SpeechRecognition || window.webkitSpeechRecognition;
    var spracheDa = Boolean(Erkenner);

    function Diktat(o) {
      this.beiSatz = o.beiSatz;
      this.beiZwischen = o.beiZwischen || function () {};
      this.beiStatus = o.beiStatus || function () {};
      this.beiFehler = o.beiFehler || function () {};
      this.sollLaufen = false;
      this.erkenner = null;
    }
    Diktat.prototype.erzeuge = function () {
      var selbst = this;
      var r = new Erkenner();
      r.lang = 'de-DE';
      r.continuous = true;
      r.interimResults = true;
      r.onresult = function (ereignis) {
        var zwischen = '';
        for (var i = ereignis.resultIndex; i < ereignis.results.length; i += 1) {
          var ergebnis = ereignis.results[i];
          var text = (ergebnis[0] && ergebnis[0].transcript ? ergebnis[0].transcript : '').trim();
          if (!text) continue;
          if (ergebnis.isFinal) selbst.beiSatz(text);
          else zwischen += text + ' ';
        }
        selbst.beiZwischen(zwischen.trim());
      };
      r.onerror = function (ereignis) {
        var art = ereignis.error;
        if (art === 'no-speech' || art === 'aborted') return;
        selbst.sollLaufen = false;
        selbst.beiStatus(false);
        if (art === 'not-allowed' || art === 'service-not-allowed') {
          selbst.beiFehler('Kein Zugriff auf das Mikrofon. In der eingebetteten Ansicht ist das oft gesperrt – der Text lässt sich genauso eintippen.');
        } else if (art === 'network') {
          selbst.beiFehler('Die Spracherkennung braucht eine Internetverbindung.');
        } else {
          selbst.beiFehler('Spracherkennung gestört (' + art + ').');
        }
      };
      r.onend = function () {
        if (selbst.sollLaufen) setTimeout(function () { if (selbst.sollLaufen) selbst.starteIntern(); }, 250);
        else selbst.beiStatus(false);
      };
      r.onstart = function () { selbst.beiStatus(true); };
      return r;
    };
    Diktat.prototype.starteIntern = function () {
      try {
        if (!this.erkenner) this.erkenner = this.erzeuge();
        this.erkenner.start();
      } catch (e) { /* bereits gestartet */ }
    };
    Diktat.prototype.start = function () {
      if (!spracheDa) {
        this.beiFehler('Dieser Browser kann noch nicht zuhören. In Chrome, Edge oder Safari klappt das Diktat – oder einfach tippen.');
        return;
      }
      this.sollLaufen = true;
      this.starteIntern();
    };
    Diktat.prototype.stopp = function () {
      this.sollLaufen = false;
      try { if (this.erkenner) this.erkenner.stop(); } catch (e) { /* egal */ }
      this.beiStatus(false);
    };
    Diktat.prototype.umschalten = function () { if (this.sollLaufen) this.stopp(); else this.start(); };

    function vorlesen(text) {
      if (!('speechSynthesis' in window)) return false;
      window.speechSynthesis.cancel();
      var a = new SpeechSynthesisUtterance(String(text).slice(0, 6000));
      a.lang = 'de-DE';
      window.speechSynthesis.speak(a);
      return true;
    }
    function vorlesenStopp() { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); }

    var MIKRO_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">' +
      '<rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor" stroke="none"/>' +

              .then(function () { return a.aufruf(steuerung.hole(), steuerung); })
              .catch(function (f) { meldung(f && f.message ? f.message : 'Das hat nicht funktioniert.', 'fehler', 6000); })

              o.beiAenderung(); zeichne(); zeichneLeiste();
              return weg;
            }
          }
          return null;
        },
      };

    /* ---------------------------------------------------------- Begriffsauswahl */
    var erklaerFunktion = null;

    (function auswahlErkennung() {
      var blase = $('#erklaer-blase');
      var knopf = $('#erklaer-knopf');
      var gemerkt = '';
      knopf.addEventListener('pointerdown', function () {
        gemerkt = String(window.getSelection ? window.getSelection().toString() : '').trim();
      });
      knopf.addEventListener('click', function () {
        var text = gemerkt || String(window.getSelection ? window.getSelection().toString() : '').trim();
        blase.hidden = true;
        gemerkt = '';
        if (text && erklaerFunktion) erklaerFunktion(text);
      });
      function pruefe() {
        var auswahl = window.getSelection ? window.getSelection() : null;
        var text = auswahl ? String(auswahl.toString()).trim() : '';
        if (!erklaerFunktion || !text || text.length < 3 || text.length > 400 || !auswahl.rangeCount) { blase.hidden = true; return; }
        var bereich = auswahl.getRangeAt(0);
        var knoten = bereich.commonAncestorContainer;
        var element = knoten.nodeType === 1 ? knoten : knoten.parentElement;
        if (!element || !element.closest('[data-erklaerbar]')) { blase.hidden = true; return; }
        var kasten = bereich.getBoundingClientRect();
        blase.hidden = false;
        blase.style.top = window.scrollY + kasten.top - 42 + 'px';
        blase.style.left = Math.max(12, window.scrollX + kasten.left) + 'px';
      }
      document.addEventListener('mouseup', function () { setTimeout(pruefe, 10); });
      document.addEventListener('touchend', function () { setTimeout(pruefe, 140); });
      var wartet = false;
      document.addEventListener('scroll', function () {
        if (wartet) return;
        wartet = true;
        requestAnimationFrame(function () { wartet = false; pruefe(); });
      }, { passive: true });
    })();

    /* ---------------------------------------------------------- Erklärdialog */
    function erklaerDialog(begriff, o) {
      o = o || {};
      var tiefe = 1;
      var erklaerung = null;
      var verlauf = [];
      var inhalt = overlay([laden('„' + begriff + '“ wird erklärt …')]);

      function textVon(mitTitel) {
        if (!erklaerung) return '';
        var teile = [];
        if (mitTitel !== false) teile.push(erklaerung.begriff);
        teile.push(erklaerung.kurz);
        (erklaerung.abschnitte || []).forEach(function (a) {
          teile.push((a.titel + ': ' + (a.text || '')).trim());
          (a.punkte || []).forEach(function (p) { teile.push('– ' + p); });
        });
        if ((erklaerung.normen || []).length) teile.push('Regelwerke: ' + erklaerung.normen.join(', '));
        verlauf.forEach(function (v) {
          teile.push('Rückfrage: ' + v.frage);
          teile.push((v.titel || 'Vertiefung') + ': ' + v.text);
          (v.punkte || []).forEach(function (p) { teile.push('– ' + p); });

        return teile.filter(Boolean).join('\n\n');

      function hole(neueTiefe) {
        tiefe = neueTiefe;
        leere(inhalt).appendChild(laden(tiefe > 1 ? 'Ausführlichere Erklärung …' : '„' + begriff + '“ wird erklärt …'));
        return KI.erklaerung(begriff, tiefe).then(function (e) { erklaerung = e; zeichne(); });
      }

      function nachfrage(frage) {
        var kasten = el('div', {}, [laden('Rückfrage wird beantwortet …')]);

        return KI.vertiefung({ begriff: (erklaerung && erklaerung.begriff) || begriff, frage: frage, bisher: textVon() })
          .then(function (antwort) {
            antwort.frage = frage;
            verlauf.push(antwort);
            zeichne();

          .catch(function () { kasten.remove(); });

        if (!erklaerung) return;
        inhalt.appendChild(el('div.karte-kopf', {}, [

            (abschnitt.punkte || []).length
              ? el('ul', { 'data-erklaerbar': '1', style: 'margin:0;padding-left:19px' },
                  abschnitt.punkte.map(function (p) { return el('li', { text: p, style: 'margin-bottom:3px' }); }))
              : null,
            el('div.knopf-reihe', { style: 'margin-top:6px' }, [
              el('button.knopf.knopf-klein.knopf-still', {
                type: 'button', text: 'Diesen Punkt erläutern',
                onclick: function () {
                  nachfrage('Erläutere genauer: ' + abschnitt.titel + ' – ' + (abschnitt.text || (abschnitt.punkte || []).join('; ')));
                },
              }),
            ]),
          ]));

            el('h3.label', { text: 'Passt dazu' }),

              return el('button.chip.chip-blau', {

              });
            })),
          ]));

        var frageFeld = diktatFeld({
          titel: 'Nachfragen',

          tiefe < 3 && KI.da() ? el('button.knopf.knopf-kupfer', {

            onclick: function () { hole(tiefe + 1); },
          }) : null,
          el('button.knopf', { type: 'button', text: '🔊 Vorlesen', onclick: function () {
            if (!vorlesen(textVon())) meldung('Vorlesen geht in diesem Browser nicht.', 'warnung');
          } }),
          el('button.knopf.knopf-still', { type: 'button', text: 'Stopp', onclick: vorlesenStopp }),
          el('button.knopf.knopf-still', { type: 'button', text: 'Text kopieren', onclick: function () { kopiere(textVon()); } }),
          o.einfuegen ? el('button.knopf.knopf-haupt', {

              o.einfuegen({ begriff: erklaerung.begriff, text: textVon(false) });
